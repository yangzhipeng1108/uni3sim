schema_version: 1
cases:
  - id: dense_tp1_fixed_output
    model: "${MODELS_ROOT}/Qwen3-0.6B"
    model_type: dense
    workload:
      name: real-vllm-dense-tp1-fixed-output
      num_requests: 16
      prompt_len: 128
      output_len: 32
      seed: 20260607
    sampling:
      temperature: 0.0
