  # `split_policy: serving` below means the backend's serving launch path is
  # used. `num_splits` is the public API request where that API exists; it is
  # not copied into Attr.SP. Attr.SP is populated only from the executed launch
  # (A800/C500), while Ascend records SP_REQUESTED=None and SP=None.
  # ── High-batch short-KV (serving decode regime, tasks=HKV·B > 512) ──
  # Serving decode batches up to B~128 with SHORT KV (256-1500); the AIV-domain
  # non-gather cost is non-linear beyond tasks=512 (single-kernel data maxed at B=32/512
