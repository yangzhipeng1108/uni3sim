# ==============================================================================
# FlashAttention kernel configuration
# ==============================================================================
kernel_name: flash_attn

# Workload parameter combinations
# Test cases = workload_configs × layers (Cartesian product)
workload_configs:
  # Controlled-split GPU microbenchmarks. `split_policy: forced` means A800
  # and C500 pass `num_splits` to FlashAttention exactly as written. Ascend
  # 910B has no equivalent public launch input. All three hardware datasets
  # share SP-free case IDs; Attr separates SP_REQUESTED from the observed SP.
  # --- [Decode] ---
