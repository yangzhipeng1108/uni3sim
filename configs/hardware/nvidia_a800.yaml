hardware_id: nvidia_a800
# ============================================================
# A800-SXM4-80GB Hardware Spec (V3 Component Tree Model)
# GA100, 108 SM, HBM2e 80GB, 40MB L2
# ============================================================
#
# Design: hardware is modeled as a recursive component tree.
# Leaf nodes with a `role` become resources for formula.py.
# Clock domains bind by name and propagate to descendants.
# Variant mutually exclusive (e.g. FP16/BF16 Tensor Core).

# ─── Clock domains ────────────────────────────────────────
# key matches component name → that component and descendants use this clock.
clock_domains:
  # Current application/default SM clock reported by nvidia-smi.  The device's
  # 1410-MHz maximum is a boost envelope, not the clock shared by every retained
  # mechanism run; only the independent empty-task sweep proved 1410 MHz.
  sm: 1140000000
  dram: 1593000000     # nominal DRAM frequency (Hz)

components:
  # ─── SM subtree (per-SM resources) ───────────────────────
  - name: sm
    count: 108
    children:
      - name: subcore
        count: 4
        children:
          - name: tensor_core
            role: compute_tensor
            scope: shared
            count: 1
            type: compute
            primary_variant: fp16
            variants:
              - name: fp16
                throughput_per_clk: 512   # per subcore: 512 FLOP/clk (8x4x8 MMA)
                                       # 252.14976 TFLOP/s nominal full-chip at 1.14 GHz;
                                       # 311.86944 TFLOP/s is the 1.41-GHz max envelope
              - name: bf16
                throughput_per_clk: 512
          - name: fma_pipe
            role: compute_fma
            scope: shared
            count: 1
            type: compute
            # Formula demand is FLOPs, not FMA instructions.  GA100 exposes
            # 16 FP32 FMA instructions = 32 FLOP per subcore per clock.
            throughput_per_clk: 32
          - name: sfu_pipe
            role: compute_sfu
            scope: shared
            count: 1
            type: compute
            throughput_per_clk: 4         # 4 SFU ops per subcore per clk
          - name: alu_pipe
            role: compute_alu
            scope: shared
            count: 1
            type: compute
            throughput_per_clk: 16        # 16 INT32 ops per subcore per clk
            service_rates_per_unit_s:
              # Exact PRMT Rdst,RZ,0x5410,Rsrc: one lane instruction/operation.
              # Independent register mechanism, fixed c4/t256/g432/o511:
              # median per-SM same-clock envelope in each of3 trials, then
              # median across trials =1.9672056077033155 warp PRMT/SM/cycle.
              # 32 lanes/warp,4 subcores/SM, all telemetry1140MHz => per
              # subcore SI rate below. No SHF/production timing substitution.
              # The dependency stream collapses to zero after2 operations;
              # separate noncollapsing0x1032 rotation agrees in this domain.
              # reference: microbench/nvidia_a800/references/
              # logits_bf16_fp32_prmt_torch_2_8_sm80.json
              prmt_b32_bf16_expand: 17940915142.25424
              # One service operation is one global int32 atomicAdd across a
              # 256-thread CTA.  The independent synthetic-counter probe
              # exactly covers the source-selected 256-thread global-atomic
              # launch for the independently measured 8-, 32- and 128-expert
              # counter arrays.  Rates are per GA100 subcore because
              # compute_alu has 4 subcores per SM; no production routing
              # tensor or duration is consumed.
              # artifact: profiler_output/microbench/nvidia_a800/
              #   moe_routing_atomic_service_a780ac7c_20260902_r5/summary.json
              moe_routing_global_atomic_e8: 9876543.467078194
              moe_routing_global_atomic_e32: 7407407.624421303
              moe_routing_global_atomic_e128: 7315958.083187977
          - name: warp_scheduler
            role: warp_issue
            scope: shared
            count: 1
            type: compute
            # GA100 has one warp scheduler per subcore.  Each scheduler issues
            # one warp instruction per clock; four subcores therefore expose
            # four warp instructions/SM/clock.
            throughput_per_clk: 1
      - name: block_reduction_dependency
        role: compute_reduction
        scope: per_unit
        count: 1
        type: compute
        # Independent BF16 vec8 Add-RMSNorm CUB reduction/publication
        # mechanism, CUDA 12.8.93 + CUB 2.7.0.  Trials 0--1 derive the
        # fixed-width services and frozen trial 2 validates them at 2.88%
        # MAPE / 12.15% max APE.  The 256/1024-thread residency segments are
        # fixed by GA100's documented 2048-thread SM limit; no target
        # production/evaluation duration is consumed.
        # report: profiler_output/microbench/nvidia_a800/
        #   a800_reduce_daa756d_20260818/report.json
        # report SHA256:
        #   35ba351ba51856cee76793059afe05d771cf86903565b4c890a49b79769b4744
        throughput_per_clk: 1
        service_rates_per_unit_s:
          block_reduce_first_256: 1317919.0751445086
          block_reduce_resident_256: 8151174.6680286
          block_reduce_queued_256: 5412462.9080118695
          block_reduce_first_1024: 1157360.4060913706
          block_reduce_resident_1024: 4000000.0
          block_reduce_queued_1024: 1530348.067887621
      - name: silu_scalar_dependency
        role: compute_vector
        scope: per_unit
        count: 1
        type: compute
        # One service operation is one register-resident scalar SiLU round
        # across a 1024-thread CTA.  The independent mechanism benchmark uses
        # no production tensor traffic or production duration.  Its 64-round
        # dependent result is 249.125 SM cycles/round; the service rate below
        # converts that dimensionless cost at Forward's 1.14-GHz model clock.
        # The production gate multiply is deliberately not included here and
        # remains a separate FMA stage in the semantic dependency path.
        # artifact: profiler_output/microbench/nvidia_a800/
        #   silu_scalar_latency_0ea587f0_20260825_r1/
        # source/output SHA256: 110027442fbed92a1dab49efd06e9013a582e128d5
        # f352a67749780c740588ca / 0b6afba885bc9a49e31bae5332fef620116981bb9
        # 7c40d7bb1b775eaa1dd4213
        throughput_per_clk: 1
        service_rates_per_unit_s:
          silu_scalar_round: 4576016.056196689
          # Non-recurrent source-SiLU entry/round services for a 1024-thread
          # CTA. Frozen rotations 0--1 derive positive affine services from
          # width 6144/53248 at grids 108/216/1024; rotation 2 validates the
          # segmented model at 0.589% MAPE / 4.059% max APE. The source
          # program's full-SM grids share one first/resident/queued CTA
          # lifecycle; launch grid determines cohort count, not a new service.
          # reference: microbench/nvidia_a800/references/
          #   silu_nonrecurrent_segmented_service_sm80.json
          silu_nonrecurrent_first_entry_block1024: 2871222.0762155065
          silu_nonrecurrent_first_round_block1024: 3667645.8245908516
          silu_nonrecurrent_resident_entry_block1024: 3859287.6067118025
          silu_nonrecurrent_resident_round_block1024: 3696081.1953763748
          silu_nonrecurrent_queued_entry_block1024: 1516637.0222549995
          silu_nonrecurrent_queued_round_block1024: 3718225.9722763854
          # Scalar RMSNorm source-loop services from an independent block1024
          # clock64 probe at exact grid64. The first four hidden widths derive
          # the two round slopes and joint phase-entry intercept; H8192/H16384
          # validate the held-out source-loop span at 1.8%/3.2% APE. The probe
          # excludes reduction, epsilon/rsqrt, and production-kernel timing.
          # reference: microbench/nvidia_a800/references/
          #   rmsnorm_grid64_scalar_round_sm80.json
          rmsnorm_input_square_first_1024: 1560093.8402309918
          rmsnorm_output_scale_first_1024: 3922413.7931034476
          rmsnorm_phase_entry_first_1024_active64: 1072031.993551686
          # Source-round services from independent block-1024 clock64 probes.
          # Forward uses the unsuffixed grid-one rates as intrinsic CTA-local
          # services. Active-unit and cold-entry cells are retained as
          # validation evidence only because they also contain launch-wide
          # cache/memory contention, which the aggregate envelope prices.
          bf16_add_square_first_256_block1024: 1853658.536585366
          bf16_add_square_first_256_active4_block1024: 1815286.6242038216
          bf16_add_square_first_256_active16_block1024: 1912751.677852349
          bf16_add_square_first_256_active108_block1024: 1655773.4204793028
          bf16_add_square_first_320_block1024: 2188099.8080614205
          bf16_add_square_first_320_active4_block1024: 1803797.4683544303
          bf16_add_square_first_320_active16_block1024: 1759259.2592592592
          bf16_add_square_first_320_active108_block1024: 1605633.8028169014
          bf16_add_square_first_512_block1024: 1772939.3468118196
          bf16_add_square_first_512_active4_block1024: 1576763.4854771784
          bf16_add_square_first_512_active16_block1024: 1511936.3395225464
          bf16_add_square_first_512_active108_block1024: 1241830.0653594772
          # Validation-only grid64/H4096 cold-minus-warm source-chain delta.
          add_rmsnorm_h4096_grid64_cold_source_chain_entry: 979166.6666666666
          bf16_add_square_first_640_block1024: 1559507.52393981
          bf16_add_square_first_640_active4_block1024: 1296928.32764505
          bf16_add_square_first_640_active8_block1024: 1363636.36363636
          bf16_add_square_first_640_active16_block1024: 1355529.13198573
          bf16_add_square_first_640_active108_block1024: 1007067.13780919
          # Exact H8192/block1024 source-round services. The source-identical
          # clock64 probe preserves the production 32-register/168-byte
          # resource signature and two-CTA residency. Three trials at each
          # exact grid show at most 0.54% spread; no production duration is
          # consumed. Artifact: profiler_output/microbench/nvidia_a800/
          #   add_rmsnorm_h8192_7d79c3db_20260907_gpu7/report.json
          bf16_add_square_first_1024_block1024: 1005734.4508160565
          bf16_add_square_first_1024_active4_block1024: 939818.6314921682
          bf16_add_square_first_1024_active8_block1024: 959595.9595959596
          bf16_add_square_first_1024_active16_block1024: 936729.6631059983
          bf16_add_square_first_1024_active108_block1024: 749506.9033530572
          bf16_scale_multiply_first_256_block1024: 2968750.0
          bf16_scale_multiply_first_256_active4_block1024: 2915601.0230179024
          bf16_scale_multiply_first_256_active16_block1024: 2733812.949640288
          bf16_scale_multiply_first_256_active108_block1024: 1770186.3354037267
          bf16_scale_multiply_first_320_block1024: 2430703.6247334755
          bf16_scale_multiply_first_320_active4_block1024: 2435897.435897436
          bf16_scale_multiply_first_320_active16_block1024: 2134831.4606741574
          bf16_scale_multiply_first_320_active108_block1024: 1123152.7093596058
          bf16_scale_multiply_first_512_block1024: 2014134.2756183746
          bf16_scale_multiply_first_512_active4_block1024: 1955403.0874785592
          bf16_scale_multiply_first_512_active16_block1024: 1858190.7090464549
          bf16_scale_multiply_first_512_active108_block1024: 981912.1447028423
          bf16_scale_multiply_first_640_block1024: 1681415.92920354
          bf16_scale_multiply_first_640_active4_block1024: 1446700.50761421
          bf16_scale_multiply_first_640_active8_block1024: 1444866.92015209
          bf16_scale_multiply_first_640_active16_block1024: 1498028.90932983
          bf16_scale_multiply_first_640_active108_block1024: 899053.627760252
          bf16_scale_multiply_first_1024_block1024: 1020590.8683974933
          bf16_scale_multiply_first_1024_active4_block1024: 1166837.2569089048
          bf16_scale_multiply_first_1024_active8_block1024: 1060465.1162790698
          bf16_scale_multiply_first_1024_active16_block1024: 1050691.2442396313
          bf16_scale_multiply_first_1024_active108_block1024: 710723.1920199501
          # First/resident 256-thread CTA services from the independent
          # globaltimer round probe. The analytical pipeline restricts these
          # values to complete source rounds and the static 8-CTA/SM resident
          # domain; queued CTAs remain unsupported.
          # reference: microbench/nvidia_a800/references/
          #   add_rmsnorm_block256_pipeline_sm80.json
          bf16_add_square_first_256_block256: 4065040.650406504
          bf16_add_square_resident_256_block256: 1315295.001878993
          # One operation is one source-round equivalent; the active-64/128
          # services below consume two operations for one measured full+tail
          # pair, so their rates are 2 / pair completion time.
          bf16_add_square_first_64_block256: 4726735.598227474
          bf16_add_square_resident_64_block256: 2271667.0385169256
          bf16_add_square_first_128_block256: 4982871.379632513
          bf16_add_square_resident_128_block256: 1662707.83847981
          bf16_scale_multiply_first_256_block256: 3906250.0
          bf16_scale_multiply_resident_256_block256: 1939058.1717451524
          bf16_scale_multiply_first_64_block256: 4961240.310077519
          bf16_scale_multiply_resident_64_block256: 3372275.0812959173
          bf16_scale_multiply_first_128_block256: 4924592.182209911
          bf16_scale_multiply_resident_128_block256: 2503072.969046821
      - name: shared_mem
        role: smem
        scope: per_unit
        count: 1
        type: memory
        throughput_per_clk: 128           # bytes per SM per clk
        traffic_filter: null
      - name: l1_cache
        role: l1_cache
        scope: per_unit
        count: 1
        type: memory
        throughput_per_clk: 128
        traffic_filter: null

  # ─── Shared resources (not per-SM) ──────────────────────
  - name: xbar
    role: xbar
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # The L2 crossbar is bounded by the same documented aggregate L2 datapath:
    # 40 slices * 2 sub-partitions * 64 B/clk = 5120 B/clk.  The former
    # 5133 B/clk value had no independent provenance.
    throughput_per_clk: 5120
    traffic_filter: null

  - name: l2
    role: l2_cache
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # Independent 8/16/24 MiB ld.global.cg streaming sweep, with SASS proving
    # 128-bit STRONG.GPU loads and NCU proving exact L1 request bytes plus
    # negligible DRAM traffic.  Retained NCU raw records
    # sm__cycles_elapsed.avg.per_second = 1.13999198652 GHz for the audited
    # run, so 2921.842 GB/s / 1.13999198652 GHz = 2563.037314779177 aggregate
    # B per SM-domain cycle.  This is the canonical sustained-read capacity
    # for the proved ld.global.cg path.  The 5120 B/clk datapath remains the
    # architectural xbar envelope; write and read/write-duplex capacity are
    # not established by this read-only microbenchmark.
    throughput_per_clk: 2563.037314779177
    traffic_filter: lru
    size_bytes: 41943040                  # 40 MB
    num_partitions: null                  # partition topology not independently established

  - name: staged_ldgsts_l2_read
    role: staged_ldgsts_l2_read
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # Independent five-slot cp.async.cg probe with the source class's
    # block-128 and two-CTA-per-SM residency.  Both idle devices reproduce
    # 4.079474218 TB/s within 0.5%.  Expressed at the 1.14-GHz model clock,
    # this is the exact aggregate ceiling for that staged LDGSTS read class;
    # it does not replace the generic ld.global.cg L2 service.
    # reference: microbench/nvidia_a800/references/
    #   staged_ldgsts_l2_service_sm80.json
    throughput_per_clk: 3578.4861564973107
    traffic_filter: null

  - name: staged_ldgsts_k32_depth6_l2_read
    role: staged_ldgsts_k32_depth6_l2_read
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # Independent six-slot cp.async.cg probe with the source program's
    # block-128, 12-KiB A/B panel and two resident CTAs per SM.  Seven trials
    # on each of two idle devices span below 0.90%; the conservative median
    # 4.134280380 TB/s endpoint is expressed at the 1.14-GHz model clock.  This
    # is only the exact aggregate
    # L2-read ceiling for the 64x128x32 depth-6 staged source class.
    # capture: profiler_output/microbench/nvidia_a800/
    #   staged_ldgsts_k32_depth6_bda2476b_d0_r3
    # reference: microbench/nvidia_a800/references/
    #   staged_ldgsts_k32_depth6_l2_service_sm80.json
    throughput_per_clk: 3626.561736947837
    traffic_filter: null

  - name: dram
    role: dram
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    # Independent 2-GiB ld.global.{cg,ca} read sweep candidate:
    # 1.79053 TB/s / 1.593 GHz = 1124 B/DRAM-domain-cycle.  SASS and NCU byte
    # counts verify the read paths, but retained raw does not prove a universal
    # write or read/write-duplex capacity.
    throughput_per_clk: 1124
    traffic_filter: page_conflict
    size_bytes: 85899345920               # 80 GB
    # A800 has a 5120-bit, five-stack HBM topology.  A controller/service
    # partition count suitable for queue modeling is not established.
    num_partitions: null

# ─── Resource groups ─────────────────────────────────────
# Same group = shared hardware -> demands ADD within group.
# Different groups = independent -> MAX across groups.
# References use role names (not component names).
resource_groups:
  - name: tensor_pipe
    members: [tensor_core_fp16]

  - name: fma_sfu_pipe
    members: [fma_pipe, sfu_pipe]

  - name: alu_pipe
    members: [alu_pipe]

  - name: warp_issue
    members: [warp_scheduler]

  - name: block_reduction_dependency
    members: [block_reduction_dependency]

  - name: silu_scalar_dependency
    members: [silu_scalar_dependency]

  - name: smem
    members: [shared_mem]

  - name: l1_cache
    members: [l1_cache]

  - name: xbar
    members: [xbar]

  - name: l2
    members: [l2]

  - name: dram
    members: [dram]

# ─── Memory subsystem (latency-hiding parameters) ────────
memory_subsystem:
  # Shared half-duplex DRAM service.  The canonical read endpoint remains the
  # independently retained 1124 B/DRAM-clock stream.  The write endpoint is
  # the audited pure-write result from the directional mechanism sweep:
  # 1798.201 GB/s / 1.593 GHz = 1128.814187068424 B/DRAM-clock.  Mixed-mode
  # timings do not define a service curve or direction-switch penalty.
  dram_arbitration_mode: shared_directional_capacity
  dram_read_capacity_per_clk: 1124
  dram_write_capacity_per_clk: 1128.814187068424
  # Independent single-chain ld.global.cg pointer chases measured with
  # %globaltimer on idle GPU 3.  The 16 MiB chain is warmed into the 40 MiB L2;
  # the DRAM chain touches 256 MiB of incompressible 32-byte sectors.  Retained
  # source, SASS, raw trials, telemetry and hashes live under
  # profiler_output/microbench/nvidia_a800/latency_spec_audit_v2_20260812/.
  dram_latency_ns: 384.224
  l2_latency_ns: 200.758
  cacheline_bytes: 128              # GA100 L2 cache-line granularity
  l2_transaction_bytes: 32          # CUDA cc>=6 global coalescing / L2 sector
  dram_transaction_bytes: 32        # physical sector carried by this global path
  # The streaming sweep proves the bandwidth-delay population required at its
  # plateau, not a scoreboard/load-queue maximum.  No hardware source ceiling
  # is asserted until a mechanism benchmark separates that structure.
  source_slots_per_unit: null
  # Full-chip logical-byte capacities for exact BF16 grouped-MoE tile streams.
  # Independent probes transfer source-shaped A/B tiles into shared memory and
  # consume them in a checksum; they contain no output matrix, routing program,
  # production kernel, or production/evaluation duration.  BM16 retains the
  # L2-resident combined service.  BM64 separates its two-slot L2-hit service
  # from the production-stride B-weight DRAM-miss service.
  memory_access_class_services:
    # The three-slot block-256 SM80 GEMM source commits one combined 128x64 A
    # plus 64x256 B panel, then waits at DEPBAR.LE SB0,1.  An independent
    # no-MMA probe measures L2-hit and compulsory-DRAM source service on idle
    # devices 0 and 4.  The conservative 1,024-round capacity from either
    # device is retained for each tier; production hit/miss bytes partition
    # the ingress and serialize through this one source program.
    # A separate 128-thread, two-resident-CTA probe reproduces the exact
    # Q64/KV128 causal period (1,1,...,32,32) using only 64-KiB K/V LDGSTS
    # rounds. The retained lower stable full-chip payload rate is 100.1422475
    # 32-B transactions/model-SM-cycle. It replaces only this K/V ingress;
    # the FA2 predictor keeps the distinct 16-KiB Q prologue on its generic
    # path and preserves independently priced downstream DRAM traffic.
    - service: sm80_fa2_paged_q64_kv128_period32_ldgsts
      access_kind: read
      ingress_resource_role: l2_cache
      signature:
        access_class: sm80_fa2_paged_q64_kv128_period32_ldgsts
        dtype: bf16
        tile_m: 64
        tile_k: 128
        logical_row_bytes: 65536
      scope: full_chip
      logical_byte_capacity_per_s: 3653189189189.1895
      evidence_ref: microbench/nvidia_a800/references/fa2_queued_ldgsts_period32_steady_frontend_sm80.json#selected_service
      replay_to_dram_fraction: null
    # An independent 128-thread, two-resident CTA probe preserves the exact
    # 82,944-B source resource class and the two Q8192/S4096 chunked-prefill
    # request programs. It contains only 64-KiB K/V LDGSTS rounds; Q, MMA,
    # softmax, mask, output, and production duration are excluded. Both exact
    # 4096-CTA source profiles close their dynamic LDGSTS instruction/byte
    # counts; retain the lower direct median as their shared K/V service.
    - service: sm80_fa2_chunked_q8192_s4096_two_resident_ldgsts
      access_kind: read
      ingress_resource_role: l2_cache
      signature:
        access_class: sm80_fa2_chunked_q8192_s4096_two_resident_ldgsts
        dtype: bf16
        tile_m: 64
        tile_k: 128
        logical_row_bytes: 65536
      scope: full_chip
      logical_byte_capacity_per_s: 3655291139240.5063
      evidence_ref: microbench/nvidia_a800/references/fa2_chunked_q8192_two_resident_ingress_sm80.json#selected_service
      replay_to_dram_fraction: null
    - service: sm80_depth3_operand_l2_hit
      access_kind: read
      ingress_resource_role: l2_cache
      signature:
        access_class: sm80_depth3_operand_l2_hit
        dtype: fp16
        tile_m: 128
        tile_k: 64
        logical_row_bytes: 49152
      scope: full_chip
      logical_byte_capacity_per_s: 3764833972150.295
      evidence_ref: microbench/nvidia_a800/references/staged_ldgsts_depth3_curve_sm80.json#selected_services/l2_resident
      replay_to_dram_fraction: null
    - service: sm80_depth3_operand_dram_miss
      access_kind: read
      ingress_resource_role: l2_cache
      signature:
        access_class: sm80_depth3_operand_dram_miss
        dtype: fp16
        tile_m: 128
        tile_k: 64
        logical_row_bytes: 49152
      scope: full_chip
      logical_byte_capacity_per_s: 1661996187566.7805
      evidence_ref: microbench/nvidia_a800/references/staged_ldgsts_depth3_curve_sm80.json#selected_services/dram_unique
      replay_to_dram_fraction: null
    # CUDA 12.2's block-128 64x64x64 stages_64x6 GEMM has only three
    # complete 16-KiB A/B operand-pair slots. The independent 64-CTA,
    # one-resident-CTA copy probe retains that source topology and its
    # L2-resident / DRAM-unique services. It is not a generic DRAM service.
    - service: sm80_64x64_depth6_operand_l2_hit
      access_kind: read
      ingress_resource_role: l2_cache
      signature:
        access_class: sm80_64x64_depth6_operand_l2_hit
        dtype: fp16
        tile_m: 64
        tile_k: 64
        logical_row_bytes: 16384
      scope: full_chip
      logical_byte_capacity_per_s: 2098201009323.0745
      evidence_ref: microbench/nvidia_a800/references/staged_ldgsts_64x64_depth6_curve_sm80.json#selected_services/l2_resident
