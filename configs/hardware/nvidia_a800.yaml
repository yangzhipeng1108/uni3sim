  # ─── Analytical L2 memory model (Little's Law) ────────────────
  # Little's Law: BW = N_outstanding / tau_avg(miss_rate)
  # where tau_avg = (1-m)*tau_hit + m*tau_miss
  #
  # The GPU-MSHR model requires one physically consistent latency chain:
  #   tau_dram_total = tau_l2_hit + tau_dram_extra.
  # Both endpoints below come from the checked-in single-dependency random-page
  # pointer chases above, so they share the same access semantics.  The older
  # 200/315-cycle near/far values came from an unavailable shmoo artifact under
  # different clock/access conditions and cannot be composed with the measured
  # 206 ns full DRAM round trip.  Until a topology-resolved benchmark records all
  # three terms together, local and remote use the measured aggregate L2 hit:
  #   200.758 ns * 1.14 GHz = 228.86412 cycles
  #   (384.224 - 200.758) ns * 1.14 GHz = 209.15124 cycles.
  l2_hit_latency_local_cycles: 228.86412
  l2_hit_latency_remote_cycles: 228.86412
  # No topology-resolved local/remote population was measured.  Equal endpoint
  # latencies make a mixture fraction unnecessary, so do not invent one.
  l2_local_fraction: null
  dram_miss_extra_cycles: 209.15124

  # Partition topology/service interval is not independently established.
