  # Measured L2 operand-residency curve of a repeated same-operand single-pass
  # stream.  An independent copy-only 2R1W probe re-executes one stream over
  # the same three buffers, keeps the repetition inside the kernel so every
  # footprint is bandwidth- rather than launch-dominated, reads with
  # ld.global.cg so loads bypass L1 and allocate in L2, and writes back so a
  # real single-pass stream's dirty-line pressure is present.  The H200 re-run
  # keeps, per footprint, the lower median of two clock-gated captures on one
  # H200 (the 45-54 MiB transition exceeds the 8% trial-spread gate).  The
  # curve replaces a binary residency threshold at l2 size_bytes, which the
  # measurement falsifies: the DRAM-served fraction stays at its 0.045 floor
  # through 42 MiB (0.70x capacity), is 0.49 at 54 MiB and 0.78 at the 60-MiB
