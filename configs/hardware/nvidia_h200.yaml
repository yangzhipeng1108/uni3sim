        1272: 2736403361344.5376
        1320: 2821878914405.0107
        1584: 3321534470989.761
        1696: 3411992141453.831
        2048: 3560529711375.2124
        2112: 3608489432703.0034
        3168: 3831533858267.7163
        3712: 3980196858638.7437
        3968: 4055121756487.026
