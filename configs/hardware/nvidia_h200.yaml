  # This is a finite asynchronous operand-stream capability, not a GEMM
  # source-program identity. The copy-only probe fixes the physical envelope:
  # 64 CTAs, 128 threads/CTA, one resident CTA/SM, three complete 16-KiB
  # operand-pair slots, and 64--512 K rounds. GEMM composes it only as a
  # non-additive completion floor, so Tensor and output work remain owned by
  # the common K-tile pipeline. Other hardware may publish the same contract
  # with its own independently measured topology and tier services.
  # Measured ramp of a finite DRAM read stream.  A stream does not reach the
  # published read capacity immediately: the achieved fraction rises with the
  # bytes each CTA streams, from about half of capacity at 0.5 MiB per CTA to
  # about 0.94 at 16 MiB, and it also rises with the CTA grid.  An independent
  # read-only probe measures that surface at a fixed request depth per CTA with
  # no operator, no matrix instruction and no shared-memory staging.  The
  # published fractions are the larger of two idle devices, which is the
  # conservative direction because a completion floor divides by them.  No
  # production shape or duration is consumed.
  dram_finite_read_stream_ramp:
    model: dram_finite_read_stream_ramp_v1
    timer_domain: cuda_event_gpu_timeline
    threads_per_cta: 128
