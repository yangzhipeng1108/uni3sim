  # the configured sustained capacity already contains protocol overhead.
  dram_protocol_efficiency: 1.0
  dram_protocol_efficiency_l1cached: 1.0
  profiler_per_kernel_traffic_reliable: true
  # Independent serial D2D-copy evidence rejects one fixed floor on top of the
  # frozen DRAM service slope: large-payload residuals grow with payload.
  # Keep unsupported until a distinct copy-engine service/setup contract is
  # proved; DRAM pointer-chase latency is not a runtime/copy-setup proxy.
  memcpy_dtod_floor_ns: null
  # ─── Analytical L2 memory model (Little's Law) ────────────────
  # Little's Law: BW = N_outstanding / tau_avg(miss_rate)
  # where tau_avg = (1-m)*tau_hit + m*tau_miss
  #
  # The GPU-MSHR model requires one physically consistent latency chain:
  #   tau_dram_total = tau_l2_hit + tau_dram_extra.
  # Both endpoints below come from the checked-in single-dependency random-page
  # pointer chases above, so they share the same access semantics.  No
  # topology-resolved benchmark separates near/far L2, so local and remote use
  # the measured aggregate H200 L2 hit at the 1.98-GHz model clock:
  #   145.341 ns * 1.98 GHz = 287.775 cycles
  #   (352.620 - 145.341) ns * 1.98 GHz = 410.412 cycles.
  l2_hit_latency_local_cycles: 287.7753076171875
  l2_hit_latency_remote_cycles: 287.7753076171875
  # No topology-resolved local/remote population was measured.  Equal endpoint
  # latencies make a mixture fraction unnecessary, so do not invent one.
  l2_local_fraction: null
  dram_miss_extra_cycles: 410.4118257522583

  # Partition topology/service interval is not independently established.
  # The solver therefore uses only the measured aggregate byte capacity.
  l2_partition_service_cycles_bw: null

  # Four warp load instructions/SM/clock is not a 32-byte-sector request rate:
  # one warp instruction can generate several sectors.  Leave the frontend
  # transaction ceiling absent until an instruction/sector mechanism sweep
