# ─── Features ────────────────────────────────────────────
features:
  kernel_memory_model: gpu_mshr
  # Same CUDA stream/event completion semantics as the A800 and C500 GPUs
  # ("self": a step's own device completion releases its output); not
  # separately measured on H200.
  async_output_release: self
  analytical_vector_dependency_paths: true
  # Ordinary global stores complete at the coherent L2 boundary; dirty-line
  # eviction is not a kernel-completion dependency. Canonical NCU traffic
  # counters independently confirm zero DRAM writes for fitting 12--15 MiB
  # Elementwise footprints and writeback only after the 40 MiB L2 is exceeded.
  gpu_store_completion_scope: l2
  # vLLM FULL-mode CUDA-graph capture pads the decode batch to the captured
  # size and dispatches every Vector kernel over the padded model-input
  # extent (one CTA per physical row, visible in the launch grid recorded by
  # the canonical Serving trace). Padding rows execute the same retained
  # source program on captured buffers, so source-bound services bind to the
  # physical extent rather than the logical token count.
  full_graph_source_program_physical_extent: true
  kernel_dtype: bf16
  l1_cache_enabled: true
  cluster_supported: false
  cluster_size: 0
  multicast_supported: false
  hw_decompression: false
  compression_ratio: 1.0
