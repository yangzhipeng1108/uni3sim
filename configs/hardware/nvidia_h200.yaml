hardware_id: nvidia_h200
# NVIDIA H200 SXM public specification: 132 SM, 141 GB HBM3e, 4.8 TB/s,
# approximately 989 TFLOPS BF16 dense / 1979 TFLOPS FP8 dense, NVLink4 900 GB/s.
# Source: https://www.nvidia.com/en-us/data-center/h200/ (accessed 2026-09-19).
# The component tree below uses H200/Hopper physical static properties.  Every
# measured mechanism value comes from an H200 re-run of the A800 probe under
# microbench/nvidia_h200/references/ (per-package reports in
# microbench/nvidia_h200/references/port_reports/); the remaining non-measured values are
# public H200 specifications or are labelled as retained A800 derivations.
#
# Design: hardware is modeled as a recursive component tree.
# Leaf nodes with a `role` become resources for formula.py.
# Clock domains bind by name and propagate to descendants.
# Variant mutually exclusive (e.g. FP16/BF16 Tensor Core).

# ─── Clock domains ────────────────────────────────────────
# key matches component name → that component and descendants use this clock.
clock_domains:
  # H200 SXM boost envelope.  A measured deployment clock should override this
  # value when one is available; it must never inherit the A800 1.14-GHz clock.
  sm: 1980000000
  # 4.8 TB/s over the 6144-bit HBM3e interface implies 6.25 GT/s, i.e. a
  # 3.125-GHz DDR clock.  The dram resource below preserves the same aggregate
  # public bandwidth.
  dram: 3125000000
  # Direct independent lts__cycles_elapsed.avg.per_second, median of all16
  # qualified cells; reference: lts_clock_domain_sm90.json. LTS remains stable
  # when SM frequency/effective progress changes. No new byte service rate.
  lts: 1707201484.5349998

components:
  # ─── SM subtree (per-SM resources) ───────────────────────
  - name: sm
    # H200 SXM uses 132 Hopper SMs.  Kernel service curves may be proxies, but
    # scheduling, occupancy and cache sharing use the physical SM count.
    count: 132
    children:
      - name: subcore
        count: 4
        children:
          - name: tensor_core
            role: compute_tensor
            scope: shared
            count: 1
            type: compute
            primary_variant: fp16
            variants:
              - name: fp16
                throughput_per_clk: 946.4015   # 989.4 TFLOP/s dense over 132 SMs at 1.98 GHz
              - name: bf16
                throughput_per_clk: 946.4015   # 989.4 TFLOP/s dense over 132 SMs at 1.98 GHz
              - name: fp8
                throughput_per_clk: 1892.8030  # 1978.9 TFLOP/s dense over 132 SMs at 1.98 GHz
          - name: fma_pipe
            role: compute_fma
            scope: shared
            count: 1
            type: compute
            # Hopper has 128 FP32 cores per SM: 32 FP32 FMA instructions, or
            # 64 FLOP, per subcore per cycle.  Formula demand is FLOPs.
            throughput_per_clk: 64
          - name: sfu_pipe
            role: compute_sfu
            scope: shared
            count: 1
            type: compute
            throughput_per_clk: 4         # 4 SFU ops per subcore per clk
          - name: alu_pipe
            role: compute_alu
            scope: shared
            count: 1
            type: compute
            throughput_per_clk: 16        # 16 INT32 ops per subcore per clk
            service_rates_per_unit_s:
              # One service operation is one global int32 atomicAdd across a
              # 256-thread CTA.  The H200 re-run of the independent
              # synthetic-counter probe exactly covers the source-selected
              # 256-thread global-atomic launch for the 8-, 32- and 128-expert
              # counter arrays, clock-gated at 1.98 GHz.  Rates are the median
              # atomic rate / (132 SMs x 4 compute_alu subcores); no
              # production routing tensor or duration is consumed.
              # reference: microbench/nvidia_h200/references/
              #   moe_routing_atomic_service_sm90.json
              moe_routing_global_atomic_e8: 12432012.867830189
              moe_routing_global_atomic_e32: 8395644.82742759
              moe_routing_global_atomic_e128: 9318409.388367346
          - name: warp_scheduler
            role: warp_issue
            scope: shared
            count: 1
            type: compute
            # GA100 has one warp scheduler per subcore.  Each scheduler issues
            # one warp instruction per clock; four subcores therefore expose
            # four warp instructions/SM/clock.
            throughput_per_clk: 1
      - name: block_reduction_dependency
        role: compute_reduction
        scope: per_unit
        count: 1
        type: compute
        # H200 re-run of the independent BF16 vec8 Add-RMSNorm CUB
        # reduction/publication probe, CUDA 12.9.86 + CUB 2.8.2, clock-gated
        # at 1.98 GHz.  Trials 0--1 derive the fixed-width services and frozen
        # trial 2 validates them at 5.88% MAPE / 15.03% max APE.  The
        # 256/1024-thread residency segments (8/2 CTAs) are fixed by the
        # 2048-thread SM limit; no target production/evaluation duration is
        # consumed.
        # reference: microbench/nvidia_h200/references/
        #   block_reduce_latency_sm90.json
        throughput_per_clk: 1
        service_rates_per_unit_s:
          block_reduce_first_256: 1461254.6125461257
          block_reduce_resident_256: 16191588.785046728
          block_reduce_queued_256: 8655737.704918033
          block_reduce_first_1024: 1252371.9165085389
          block_reduce_resident_1024: 7071428.571428571
          block_reduce_queued_1024: 2433179.723502304
      - name: silu_scalar_dependency
        role: compute_vector
        scope: per_unit
        count: 1
        type: compute
        # One service operation is one register-resident scalar SiLU round
        # across a 1024-thread CTA.  The H200 re-run of the independent
        # mechanism benchmark uses no production tensor traffic or production
        # duration.  Its 64-round dependent result is 215.266 SM cycles/round;
        # the service rate below converts that cost at the 1.98-GHz model
        # clock.  The production gate multiply is deliberately not included
        # here and remains a separate FMA stage in the semantic dependency
        # path.
        # reference: microbench/nvidia_h200/references/
        #   silu_scalar_latency_sm90.json
        throughput_per_clk: 1
        service_rates_per_unit_s:
          silu_scalar_round: 9197922.570215454
          # Non-recurrent source-SiLU entry/round services for a 1024-thread
          # CTA, re-measured on H200 at 1.98 GHz. Frozen rotations 0--1 derive
          # positive affine services from width 6144/53248 at grids
          # 132/264/1056; held-out rotation 2 validates the segmented model at
          # 0.539% mean / 3.503% max duration APE. The source program's full-SM
          # grids share one first/resident/queued CTA lifecycle; launch grid
          # determines cohort count, not a new service.
          # reference: microbench/nvidia_h200/references/
          #   silu_nonrecurrent_segmented_service_sm90.json
          silu_nonrecurrent_first_entry_block1024: 6124260.355029585
          silu_nonrecurrent_first_round_block1024: 6949621.349407703
          silu_nonrecurrent_resident_entry_block1024: 4186816.2177070873
          silu_nonrecurrent_resident_round_block1024: 7194170.731225687
          silu_nonrecurrent_queued_entry_block1024: 2618413.897027644
          silu_nonrecurrent_queued_round_block1024: 7183744.294038195
          # Retained A800 derivation (no H200 measurement): these three rates
          # are the A800 values, not ported to H200 (see row D of
          # microbench/nvidia_h200/references/port_reports/wp5_vector.md).
          # Scalar RMSNorm source-loop services from an independent block1024
          # clock64 probe at exact grid64. The first four hidden widths derive
          # the two round slopes and joint phase-entry intercept; H8192/H16384
          # validate the held-out source-loop span at 1.8%/3.2% APE. The probe
          # excludes reduction, epsilon/rsqrt, and production-kernel timing.
          # reference: microbench/nvidia_a800/references/
          #   rmsnorm_grid64_scalar_round_sm80.json
          rmsnorm_input_square_first_1024: 1560093.8402309918
          rmsnorm_output_scale_first_1024: 3922413.7931034476
          rmsnorm_phase_entry_first_1024_active64: 1072031.993551686
          # Source-round services from independent block-1024 clock64 probes.
          # Forward uses the unsuffixed grid-one rates as intrinsic CTA-local
          # services. Active-unit and cold-entry cells are retained as
          # validation evidence only because they also contain launch-wide
          # cache/memory contention, which the aggregate envelope prices.
          bf16_add_square_first_256_block1024: 2959641.255605381
          bf16_add_square_first_256_active4_block1024: 3852140.0778210117
          bf16_add_square_first_256_active16_block1024: 3807692.3076923075
          bf16_add_square_first_256_active132_block1024: 2773109.243697479
          bf16_add_square_first_320_block1024: 3807692.3076923075
          bf16_add_square_first_320_active4_block1024: 3721804.5112781953
          bf16_add_square_first_320_active16_block1024: 3069767.4418604653
          bf16_add_square_first_320_active132_block1024: 2776998.5974754556
          bf16_add_square_first_512_block1024: 3188405.797101449
          bf16_add_square_first_512_active4_block1024: 3168000.0
          bf16_add_square_first_512_active16_block1024: 2800565.7708628005
          bf16_add_square_first_512_active132_block1024: 1821527.1389144433
          # Retained A800 derivation (no H200 measurement): validation-only
          # grid64/H4096 cold-minus-warm source-chain delta, A800 value.
          add_rmsnorm_h4096_grid64_cold_source_chain_entry: 979166.6666666666
          bf16_add_square_first_640_block1024: 2933333.3333333335
          bf16_add_square_first_640_active4_block1024: 2865412.445730825
          bf16_add_square_first_640_active8_block1024: 2681110.3588354774
          bf16_add_square_first_640_active16_block1024: 2490566.037735849
          bf16_add_square_first_640_active132_block1024: 1811527.9048490394
          # Exact H8192/block1024 source-round services, re-measured on H200
          # at 1.98 GHz. The source-identical clock64 probe preserves the
          # production 32-register/168-byte resource signature and two-CTA
          # residency. Three trials at each exact grid show at most 0.81%
          # spread; no production duration is consumed.
          # reference (active_1024): microbench/nvidia_h200/references/
          #   add_rmsnorm_block1024_pipeline_sm90.json
          bf16_add_square_first_1024_block1024: 1960396.0396039605
          bf16_add_square_first_1024_active4_block1024: 1954590.3257650542
          bf16_add_square_first_1024_active8_block1024: 1914893.6170212766
          bf16_add_square_first_1024_active16_block1024: 1862652.8692380057
          bf16_add_square_first_1024_active132_block1024: 1352459.0163934426
          bf16_scale_multiply_first_256_block1024: 4370860.927152318
          bf16_scale_multiply_first_256_active4_block1024: 4177215.189873418
          bf16_scale_multiply_first_256_active16_block1024: 4142259.4142259415
          bf16_scale_multiply_first_256_active132_block1024: 3567567.5675675673
          bf16_scale_multiply_first_320_block1024: 4323144.104803493
          bf16_scale_multiply_first_320_active4_block1024: 4133611.6910229647
          bf16_scale_multiply_first_320_active16_block1024: 3852140.0778210117
          bf16_scale_multiply_first_320_active132_block1024: 3289036.5448504984
          bf16_scale_multiply_first_512_block1024: 3771428.5714285714
          bf16_scale_multiply_first_512_active4_block1024: 3425605.53633218
          bf16_scale_multiply_first_512_active16_block1024: 3027522.9357798165
          bf16_scale_multiply_first_512_active132_block1024: 2348754.4483985766
          bf16_scale_multiply_first_640_block1024: 3449477.3519163765
          bf16_scale_multiply_first_640_active4_block1024: 3027522.9357798165
          bf16_scale_multiply_first_640_active8_block1024: 2894736.8421052634
          bf16_scale_multiply_first_640_active16_block1024: 2704918.0327868853
          bf16_scale_multiply_first_640_active132_block1024: 2190265.4867256638
          bf16_scale_multiply_first_1024_block1024: 2002022.2446916078
          bf16_scale_multiply_first_1024_active4_block1024: 1989949.7487437185
          bf16_scale_multiply_first_1024_active8_block1024: 1972111.5537848605
          bf16_scale_multiply_first_1024_active16_block1024: 1989949.7487437185
          bf16_scale_multiply_first_1024_active132_block1024: 1659681.4752724224
          # First/resident 256-thread CTA services from the H200 re-run of the
          # independent globaltimer round probe. The analytical pipeline
          # restricts these values to complete source rounds and the static
          # 8-CTA/SM resident domain; queued CTAs remain unsupported.
          # reference: microbench/nvidia_h200/references/
          #   add_rmsnorm_block256_pipeline_sm90.json
          bf16_add_square_first_256_block256: 7236544.549977385
          bf16_add_square_resident_256_block256: 3075909.0409755027
          # One operation is one source-round equivalent; the active-64/128
          # services below consume two operations for one measured full+tail
          # pair, so their rates are 2 / pair completion time.
          bf16_add_square_first_64_block256: 10130389.188975288
          bf16_add_square_resident_64_block256: 5516069.554189535
          bf16_add_square_first_128_block256: 9220407.354715554
          bf16_add_square_resident_128_block256: 3812798.4067949518
          bf16_scale_multiply_first_256_block256: 8268733.850129199
          bf16_scale_multiply_resident_256_block256: 4017072.5583730857
          bf16_scale_multiply_first_64_block256: 8922347.692736652
          bf16_scale_multiply_resident_64_block256: 9461707.014440719
          bf16_scale_multiply_first_128_block256: 8793473.593817089
          bf16_scale_multiply_resident_128_block256: 7429857.91225968
      - name: shared_mem
        role: smem
        scope: per_unit
        count: 1
        type: memory
        throughput_per_clk: 128           # bytes per SM per clk
        traffic_filter: null
      - name: l1_cache
        role: l1_cache
        scope: per_unit
        count: 1
        type: memory
        throughput_per_clk: 128
        traffic_filter: null

  # ─── Shared resources (not per-SM) ──────────────────────
  - name: xbar
    role: xbar
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # Retained A800 derivation (no H200 measurement): the A800 aggregate L2
    # datapath 40 slices * 2 sub-partitions * 64 B/clk = 5120 B/clk.  H200's
    # slice count is not documented; the measured8.82TB/s L2 service stays
    # below this nominal10.14TB/s envelope (different reference clocks).
    throughput_per_clk: 5120
    traffic_filter: null

  - name: l2
    role: l2_cache
    scope: shared
    clock_domain: lts
    count: 1
    type: memory
    # H200 re-run of the L2-resident ld.global.cg streaming probe
    # (l2_read_bandwidth_sm90.json, CUDA events, clock-gated at 1.98 GHz),
    # now expressed per direct LTS-domain cycle. This is sustained read for
    # the ld.global.cg path; write and read/write-duplex capacity are not
    # established by this read-only probe (no NCU on the H200 host).
    # Preserve the existing8.820176TB/s in the direct LTS reference domain;
    # a provisional per-kernel SM clock must not scale this independent port.
    throughput_per_clk: 5166.452864468075  # lts_clock_domain_sm90.json
    traffic_filter: lru
    size_bytes: 62914560                  # 60 MiB, device-reported H200 L2
    num_partitions: null                  # partition topology not independently established

  - name: staged_ldgsts_l2_read
    role: staged_ldgsts_l2_read
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # H200 re-run of the five-slot cp.async.cg probe with the source class's
    # block-128 and two-CTA-per-SM residency, expressed at the 1.98-GHz model
    # clock.  Aggregate ceiling for that staged LDGSTS read class only; it does
    # not replace the generic ld.global.cg L2 service.
    # reference: microbench/nvidia_h200/references/
    #   staged_ldgsts_l2_service_sm90.json
    throughput_per_clk: 4650.571645143812
    traffic_filter: null

  - name: staged_ldgsts_k32_depth6_l2_read
    role: staged_ldgsts_k32_depth6_l2_read
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # H200 re-run of the six-slot cp.async.cg probe with the source program's
    # block-128, 12-KiB A/B panel and two resident CTAs per SM, expressed at
    # the 1.98-GHz model clock.  Aggregate L2-read ceiling for the 64x128x32
    # depth-6 staged source class only.
    # reference: microbench/nvidia_h200/references/
    #   staged_ldgsts_k32_depth6_l2_service_sm90.json
    throughput_per_clk: 5181.479300274458
    traffic_filter: null

  - name: dram
    role: dram
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    # H200-measured achievable DRAM read capacity per DRAM cycle (envelope of
    # dram_read_capacity_protocol_sm90.json and the finite-stream ramp); the
    # public 4.8 TB/s / 3.125 GHz = 1536 B/cycle is the write bound below.
    throughput_per_clk: 1478.7609855270666
    traffic_filter: page_conflict
    size_bytes: 151397892096             # 141 GiB HBM3e public capacity
    # H200 controller/service partition topology is not established for
    # queue modeling.
    num_partitions: null

# ─── Resource groups ─────────────────────────────────────
# Same group = shared hardware -> demands ADD within group.
# Different groups = independent -> MAX across groups.
# References use role names (not component names).
resource_groups:
  - name: tensor_pipe
    members: [tensor_core_fp16]

  - name: fma_sfu_pipe
    members: [fma_pipe, sfu_pipe]

  - name: alu_pipe
    members: [alu_pipe]

  - name: warp_issue
    members: [warp_scheduler]

  - name: block_reduction_dependency
    members: [block_reduction_dependency]

  - name: silu_scalar_dependency
    members: [silu_scalar_dependency]

  - name: smem
    members: [shared_mem]

  - name: l1_cache
    members: [l1_cache]

  - name: xbar
    members: [xbar]

  - name: l2
    members: [l2]

  - name: dram
    members: [dram]

# ─── Memory subsystem (latency-hiding parameters) ────────
memory_subsystem:
  # Shared half-duplex DRAM service: measured H200 read capacity; the write
  # capacity is the public H200 HBM3e rate (no H200 write probe).
  dram_arbitration_mode: shared_directional_capacity
  dram_read_capacity_per_clk: 1478.7609855270666  # H200 envelope of dram_read_bw and the finite-stream ramp
  dram_write_capacity_per_clk: 1536
  # H200 re-run of the single-chain ld.global.cg pointer chases
  # (pointer_chase_latency_sm90.json, %globaltimer): the L2 chain stays inside
  # the 60 MiB L2 and the DRAM chain touches 256 MiB of 32-byte sectors.
  dram_latency_ns: 352.61976432800293
  l2_latency_ns: 145.341064453125
  cacheline_bytes: 128              # GA100 L2 cache-line granularity
  l2_transaction_bytes: 32          # CUDA cc>=6 global coalescing / L2 sector
  dram_transaction_bytes: 32        # physical sector carried by this global path
  # The streaming sweep proves the bandwidth-delay population required at its
  # plateau, not a scoreboard/load-queue maximum.  No hardware source ceiling
  # is asserted until a mechanism benchmark separates that structure.
  source_slots_per_unit: null
  # Full-chip logical-byte capacities for exact BF16 grouped-MoE tile streams.
  # Independent probes transfer source-shaped A/B tiles into shared memory and
  # consume them in a checksum; they contain no output matrix, routing program,
  # production kernel, or production/evaluation duration.  BM16 retains the
  # L2-resident combined service.  BM64 separates its two-slot L2-hit service
  # from the production-stride B-weight DRAM-miss service.
  memory_access_class_services:
    # Independent finite byte-ring body progress; exact eligible grids only.
    # Typed capacities are consumed as a competing completion floor, never
    # as a generic L2 rate, additive barrier fee or global-byte multiplier.
    - service: finite_async_copy_threads128_slots2_b16384
      access_kind: read
      ingress_resource_role: l2_cache
      signature:
        access_class: finite_async_copy_threads128_slots2_b16384
        dtype: bf16
        tile_m: 16
        tile_k: 64
        logical_row_bytes: 1024
      scope: full_chip
      logical_byte_capacity_per_s: 1913459854014.5984
      logical_byte_capacity_per_s_by_grid_ctas:
        128: 1913459854014.5984
        160: 2127792207792.2075
        192: 2306252199413.4897
        256: 2508555023923.445
        320: 2560000000000.0
        384: 2656864864864.865
        512: 2774010582010.582
        640: 2896618784530.3867
        768: 2970470254957.5073
        1024: 2995931428571.4287
        1280: 3268628428927.681
      evidence_ref: microbench/nvidia_h200/references/finite_async_byte_progress_sm90.json#programs/b16384_s2_r128_stride1024
      replay_to_dram_fraction: null
    - service: finite_async_copy_threads128_slots2_b16384
      access_kind: read
      ingress_resource_role: l2_cache
      signature:
        access_class: finite_async_copy_threads128_slots2_b16384
        dtype: bf16
        tile_m: 16
        tile_k: 64
        logical_row_bytes: 4096
      scope: full_chip
      logical_byte_capacity_per_s: 2036069902912.6213
      logical_byte_capacity_per_s_by_grid_ctas:
        128: 2036069902912.6213
        160: 2383127272727.2725
        192: 2700195708154.5063
        256: 2991657631954.351
        320: 3204694376528.1177
        384: 3287072100313.4795
        512: 3504013366750.2085
        640: 3642153525529.6978
        768: 3715061116031.8867
        1024: 3556755564977.74
      evidence_ref: microbench/nvidia_h200/references/finite_async_byte_progress_sm90.json#programs/b16384_s2_r128_stride4096
      replay_to_dram_fraction: null
    # Single-panel tables only admit the existing work-conserving envelope;
    # their byte-body rates do not price operand/matrix/output stages.
    - service: single_panel_async_copy_threads128_resident8_b16384
      access_kind: read
      ingress_resource_role: l2_cache
      signature:
        access_class: single_panel_async_copy_threads128_resident8_b16384
        dtype: bf16
        tile_m: 16
        tile_k: 128
        logical_row_bytes: 1536
      scope: full_chip
      logical_byte_capacity_per_s: 2736403361344.5376
      logical_byte_capacity_per_s_by_grid_ctas:
