hardware_id: ascend_910b
# ============================================================
# Ascend 910B2 Hardware Spec — AIC/AIV SEPARATED NPU model (V3 tree)
# ============================================================
#
# Architecture (differs fundamentally from NVIDIA A800 / MetaX C500):
# 910B is an NPU with separate AIC (Cube) / AIV (Vector) domains (cube_vector_combine=split).
# Unlike coupled SMs, 24 Cube cores and 48 Vector cores form independent parallel domains, each with
# scalar units, exchanging data through Global Memory. Each kernel runs on AIC or AIV; in-core
# pipes (cube/mte1/mte2/fixpipe or vector/mte2/mte3) are distinct architectural resources. Current
# aggregate-only Forward consumes only resource envelopes supported by INI/static evidence; it does not use
# whole-kernel or domain-specific production duration to derive latency envelopes.
#
# Authoritative source: CANN platform INI /usr/local/Ascend/cann-8.5.1/.../Ascend910B2.ini
#   (official configuration read by the compiler/FE, rather than inferred from a datasheet).
# [INI] = authoritative platform configuration; [NEEDS_MICROBENCH] = independent mechanism measurement required.

# ─── Clock domains ────────────────────────────────────────
clock_domains:
  sm: 1800000000        # [INI] cube_freq=1800MHz
                        # (named sm for the formula/hw_spec interface; physically the AIC/AIV core clock)
  aic: 1800000000       # AIC (Cube core) clock
  aiv: 1800000000       # AIV (Vector core) clock
  dram: 1800000000      # Normalized GM model clock (physical HBM clock unknown; normalize B/clk to core clock)

# ─── Components: two separate core domains + shared L2/GM ───
components:
  # ═══ AIC domain: 24 Cube cores ═══════════════════════════
  - name: sm                            # Interface name "sm" = primary compute domain = AIC (required by formula)
    count: 24                           # [INI] cube_core_cnt=24
    clock_domain: aic
    children:
      - name: subcore
        count: 1
        children:
          - name: tensor_core
            role: compute_tensor
            scope: shared
            count: 1
            type: compute
            # [INI] cube_m/n/k_size = 16/16/16 (Default dtype MMA tile)
            primary_variant: fp16
            variants:
              - name: fp16
                throughput_per_clk: 8192   # [INI] 16x16x16 MMA=8192 FLOP/clk/AIC
              - name: bf16
                throughput_per_clk: 8192   # support_bf16=1, same tile as fp16
          - name: fma_pipe                 # AIC scalar (limited to address/control), not vector FMA
            role: compute_fma
            scope: shared
            count: 1
            type: compute
            throughput_per_clk: 16         # [NEEDS_MICROBENCH] AIC scalar, placeholder
            # [MEASURED_MECHANISM] Every CANN 8.5.1 GroupedMatmul AIC scans
            # the complete finite cumulative group list before completing its
            # source program. The exact service includes UpdateMnConfig,
            # GetSplitValueFromGroupList, SetMNConfig, and zero-row continue.
            exact_request_services:
              cann_grouped_matmul_finite_group_scan_control:
                request_size_unit: expert_groups
                service_time_unit: ns_per_request_per_aic
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/grouped_matmul_finite_group_scan_cann_8_5_1.json
                evidence_sha256: 5d2b3e0d7c7b1fce48a7b41e593a9074d8cba83a0d125a1d236e5bd3808fd186
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 8, service_time_ns: 930.0}
                  - {request_size: 32, service_time_ns: 3200.0}
                  - {request_size: 128, service_time_ns: 11870.0}
                  - {request_size: 256, service_time_ns: 18100.0}
                  - {request_size: 512, service_time_ns: 26590.0}
              # Legacy per-zero-row service remains explicit for synthetic
              # group counts outside the finite-scan evidence domain.
              cann_grouped_matmul_zero_expert_control:
                request_size_unit: zero_expert_iterations
                service_time_unit: ns_per_request_per_aic
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/grouped_matmul_zero_expert_control_cann_8_5_1.json
                evidence_sha256: 8d6d8ace60fbe0ec9b1a1bbec9a6198679da42cd9cad0ec7d0e36e5746faf7a9
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 1, service_time_ns: 7.387570991549605}
              # [MEASURED_MECHANISM] One dependency-chained int32
              # GlobalTensor::GetValue on AIC. CANN SplitFuse uses the
              # returned block-table value as the address dependency of each
              # paged QK/PV GM-to-L1 descriptor. The AIC-only evidence is
              # separate from the otherwise identical AIV-scoped service.
              aic_scalar_global_get_value_serialized:
                request_size_unit: int32_values
                service_time_unit: ns_per_request_per_aic
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/aic_scalar_global_get_value_cann_8_5_1.json
                evidence_sha256: de512116928c8f16acf6d7b1f1d47b1d341459dbac8d0ce0b1728839683c3cc2
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 1, service_time_ns: 93.31694666544601}
          - name: sfu_pipe
            role: compute_sfu
            scope: shared
            count: 1
            type: compute
            throughput_per_clk: 4          # [NEEDS_MICROBENCH] Placeholder (dedicated SFU belongs to the Vector domain, not AIC)
          - name: alu_pipe
            role: compute_alu
            scope: shared
            count: 1
            type: compute
            throughput_per_clk: 16         # [NEEDS_MICROBENCH] AIC scalar
      # AIC local storage (per AIC), from authoritative INI [AICoreSpec]
      - name: shared_mem                   # Maps to L1 (Cube staging; formula uses the smem name)
        role: smem
        scope: per_unit
        count: 1
        type: memory
        throughput_per_clk: 512            # [INI] l1_to_l0_a_rate=512 (relative rate, L1→L0A)
        traffic_filter: null
        size_bytes: 524288                 # [INI] l1_size=524288 (512KB)
      - name: l1_cache
        role: l1_cache
        scope: per_unit
        count: 1
        type: memory
        throughput_per_clk: 512            # [INI] Peak L1-to-L0 throughput
        traffic_filter: null
        size_bytes: 524288                 # [INI] l1_size=524288 (512KB)
      # AIC local buffer sizes (authoritative INI; retained without constraining the current model)
      - name: l0a_buffer
        role: l0a_buffer
        scope: per_unit
        count: 1
        type: memory
        size_bytes: 65536                  # [INI] l0_a_size (64KB, Cube left matrix)
        throughput_per_clk: 512            # [INI] l1_to_l0_a_rate
        traffic_filter: null
        # [MEASURED_MECHANISM] One completed CANN 8.5.1 NBuffer33
        # A1->A2/B1->B2 BF16 base-pair.  The isolated source-compatible
        # program keeps the source's 3A1/2B1/2L0 ownership and excludes MTE2,
        # Cube, FixPipe, workspace and output.  It replaces only L0A's
        # byte-capacity lower bound within that local pair; L0B remains an
        # independently conserved concurrent node of the same stage.
        exact_request_services:
          cann_nbuffer33_l1_to_l0_pair_completion:
            request_size_unit: completed_source_pairs
            service_time_unit: ns_per_completed_load_pair_per_aic
            lookup_policy: exact_only
            evidence_ref: microbench/ascend_910b/references/aic_nbuffer33_mte1_pair_completion_cann_8_5_1.json
            evidence_sha256: 0e2a4139f787c6d30e68b6f1e9c4f817da20e288dd82db0d7aa5e615b1a32f78
            production_or_evaluation_duration_consumed: false
            entries:
              - {request_size: 1, service_time_ns: 214.441666667}
      - name: l0b_buffer
        role: l0b_buffer
        scope: per_unit
        count: 1
        type: memory
        size_bytes: 65536                  # [INI] l0_b_size (64KB, Cube right matrix)
        throughput_per_clk: 256            # [INI] l1_to_l0_b_rate
        traffic_filter: null
      - name: l0c_buffer
        role: l0c_buffer
        scope: per_unit
        count: 1
        type: memory
        size_bytes: 131072                 # [INI] l0_c_size (128KB, Cube output/accumulator)
        throughput_per_clk: 256            # [INI] l0_c_to_ub_rate
        traffic_filter: null
      - name: bt_buffer
        role: bt_buffer
        scope: per_unit
        count: 1
        type: memory
        size_bytes: 1024                   # [INI] bt_size (BiasTable)
        throughput_per_clk: 128            # [NEEDS_MICROBENCH]
        traffic_filter: null

  # ═══ AIV domain: 48 Vector cores (INI vector_core_cnt=48, AIC:AIV=1:2) ═══
  # Mirror INI: the Vector domain is independent of AIC and exchanges data through GM. VECTOR predictor routes
  # arithmetic demand to compute_vector, deriving active cores from its 48 physical instances;
  # GEMM/FA AIC demand still uses separate Cube/FMA/SFU/ALU resources.
  - name: aiv_core
    count: 48                             # [INI] vector_core_cnt=48
    clock_domain: aiv
    children:
      - name: subcore
        count: 1
        children:
          - name: vector_pipe
            role: compute_vector
            scope: shared
            count: 1
            type: compute
            throughput_per_clk: 128        # [INI] vec_calc_size=128 (Vector compute width per cycle)
                                           # [NEEDS_MICROBENCH] Absolute ops/clk requires measurement
            service_rates_per_unit_s:
              generic: 230400000000.0      # [INI] 128 op/clk × 1.8 GHz/AIV
              exp: 57141146934.15772       # independent UB-resident opcode microbench
              div: 28749679296.599228      # independent UB-resident opcode microbench
              # [MEASURED_MECHANISM] UB-resident serialized intrinsic
              # services from the independent three-run CANN 8.5.1 campaign.
              # Runs 1--2 determine one affine service over
              # 32/2048/6144/8192 elements; run 3 validates every point.
              # The per-service maximum validation APEs are 24.573%,
              # 20.798%, 1.446%, 0.698%, and 11.965%.
              # No production/evaluation duration is consumed.  Provenance:
              # microbench/ascend_910b/references/
              # vector_serialized_services_extended_cann_8_5_1.json.
              cast_bf16_to_fp32_serialized: 110056069160.53542
              cast_fp32_to_bf16_serialized: 119733617430.41313
              muls_serialized: 115200160513.50398
              adds_serialized: 115567328768.90584
              mul_serialized: 57423356527.404495
              # [MEASURED_MECHANISM] CANN 8.5.1 key-0 RMSNorm's
              # source-exact half-interval FP32 reduction.  The affine
              # service uses geometric mechanism sizes 2048/4096/8192;
              # 2560/5120/12288 independently validate it at <=6.24% APE.
              # No production/evaluation duration is consumed.  Provenance:
              # microbench/ascend_910b/references/
              # rmsnorm_half_interval_reduce_cann_8_5_1.json.
              rmsnorm_half_interval_reduce: 43849883505.65282
              # [MEASURED_MECHANISM] Serialized per-launch completion of the
              # routing-mask elementwise compare (aten ne.Scalar int32->bool)
              # and conversion (aten _to_copy/copy_ bool->BF16) services.
              # The independent three-run CANN 8.5.1 graph-captured campaign
              # (run1+run2 calibrate, run3 validates) covers the 11-cell
              # production element domain 8..27648; maximum validation APEs
              # are 9.598% (ne.Scalar) and 3.118% (bool->BF16 cast).  The
              # steady rate is the chip-level serialized completion-stream
              # rate: measured per-launch completion grows with total N at
              # constant per-worker elements, so the rate does NOT
              # parallelize across the 48 AIV workers and is consumed as a
              # single-owner worker stream (one worker holds the whole
              # element count).  No production or evaluation duration is
              # consumed.  Provenance: microbench/ascend_910b/references/
              # elementwise_compare_cast_serialized_service_cann_8_5_1.json.
              notequal_int32_bool_serialized: 10242694134.990414
              cast_bool_bf16_serialized: 26043124700.73857
              # [MEASURED_MECHANISM] CANN 8.5.1 AddRMSNorm key-30's
              # source-exact ReduceSumFP32 sequence: Duplicate, repeated-
              # stride Add accumulation, WholeReduceSum, and PIPE_V barriers.
              # The affine service uses 2048/4096/8192 elements and validates
              # 2560/5120/12288 independently at <=0.002% APE.  No production
              # or evaluation duration is consumed.  Provenance:
              # microbench/ascend_910b/references/
              # add_rmsnorm_reduce_sum_fp32_cann_8_5_1.json.
              add_rmsnorm_reduce_sum_fp32: 28800251118.261005
              # [MEASURED_MECHANISM] CANN 8.5.1 KernelRmsNormMergeN
              # (RmsNorm tiling key 2) row-group Vector primitives.
              # Each service drives one literal source call in UB
              # with one PIPE_V barrier, no GM traffic and no
              # production operator; the affine service is
              # calibrated on run r1 and validated on the
              # independent run r2 over row groups 1..84 at the
              # source numColAlign of 128.  Request sizes are FP32
              # elements, except the Brcb service whose source
              # parameter is the row count.  See microbench/ascend_910b/references/merge_n_row_group_services_cann_8_5_1.json.
              merge_n_reduce_sum_multi_n: 20572410622.4138
              merge_n_broadcast_gamma: 12575300044.148874
              merge_n_broadcast_rstd: 113469164554.13232
              merge_n_performance_rstd_brcb: 1800191684.0902452
              merge_n_performance_mul_row_rstd: 65636623546.36563
              merge_n_performance_mul_row_gamma: 39904676819.78892
            service_setup_time_s:
              exp: 1.6356413618500014e-08 # 16.3564136185 ns/intrinsic
              div: 1.7164424957999984e-08 # 17.1644249580 ns/intrinsic
              cast_bf16_to_fp32_serialized: 1.5626850274351996e-08
              cast_fp32_to_bf16_serialized: 1.5168087558500744e-08
              muls_serialized: 1.4375519819395941e-08
              adds_serialized: 1.3515066031169532e-08
              mul_serialized: 1.561544722489508e-08
              rmsnorm_half_interval_reduce: 8.694661458349999e-08
              add_rmsnorm_reduce_sum_fp32: 4.611165364599998e-08
              # [MEASURED_MECHANISM] CANN 8.5.1 KernelRmsNormMergeN
              # (RmsNorm tiling key 2) row-group Vector primitives.
              # Each service drives one literal source call in UB
              # with one PIPE_V barrier, no GM traffic and no
              # production operator; the affine service is
              # calibrated on run r1 and validated on the
              # independent run r2 over row groups 1..84 at the
              # source numColAlign of 128.  Request sizes are FP32
              # elements, except the Brcb service whose source
              # parameter is the row count.  See microbench/ascend_910b/references/merge_n_row_group_services_cann_8_5_1.json.
              merge_n_reduce_sum_multi_n: 5.457836357300252e-08
              merge_n_broadcast_gamma: 2.2440541043005797e-08
              merge_n_broadcast_rstd: 3.441571776019291e-08
              merge_n_performance_rstd_brcb: 9.447089739018087e-09
              merge_n_performance_mul_row_rstd: 2.6483594897358368e-08
              merge_n_performance_mul_row_gamma: 2.081505429820112e-08
              # [MEASURED_MECHANISM] Fixed per-launch setup term of the
              # serialized routing-mask compare/cast services; see the
              # service_rates entry above for the campaign and provenance.
              notequal_int32_bool_serialized: 1.1356729808943533e-06
              cast_bool_bf16_serialized: 9.614320350673968e-07
            # [MEASURED_MECHANISM] Exact UB-resident serialized
            # Sqrt->Duplicate->Div request service.  The independent r2
            # campaign covers every source-supported FP32 request size 1..64,
            # and the later merge_n campaign extends the identical mechanism
            # to 65..84 because CANN RmsNorm MERGE_N normalizes one
            # rowFactor=84 row group per request.  Both domains
            # require three runs and 1/24/48-AIV invariance, and consume no
            # production/evaluation duration.  Exact lookup only: the
            # non-monotonic 8-element mask boundary is retained, not smoothed.
            exact_request_services:
              # [MEASURED_MECHANISM] One ordered LocalTensor<float>::SetValue
              # fill followed by the S->V SetFlag/WaitFlag handoff.  Exact
              # 64/128-write requests match the source-supported RoPE head
              # dimensions.  Three independent runs verify invariance across
              # 1/24/48 active AIVs without production/evaluation duration.
              local_scalar_fill_s_v:
                request_size_unit: fp32_scalar_writes
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/local_scalar_fill_s_v_cann_8_5_1.json
                evidence_sha256: 94113d04f491080a30a758c3a598dc78d11d2fd43d66de6d1901070140e45327
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 64, service_time_ns: 291.110839844}
                  - {request_size: 128, service_time_ns: 569.444173177}
              # [MEASURED_MECHANISM] Exact UB-to-UB DataCopy request
              # services.  Payload and block-stride domains are fixed by the
              # public ATB BF16 RoPE source.  Three independent runs verify
              # invariance across 1/24/48 active AIVs; no production or
              # evaluation duration is consumed.
              local_ub_copy_contiguous:
                request_size_unit: payload_bytes
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/local_ub_copy_contiguous_cann_8_5_1.json
                evidence_sha256: ac848b177ae72fc05d3bdc9e83829f6950ffbd5af74baca30aa7da88409f8e59
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 128, service_time_ns: 10.0}
                  - {request_size: 256, service_time_ns: 10.0}
                  - {request_size: 512, service_time_ns: 10.555826823}
              local_ub_copy_stride_64b:
                request_size_unit: payload_bytes
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/local_ub_copy_stride_64b_cann_8_5_1.json
                evidence_sha256: 16c408982a3e1325a51c2e29a3773085ea569056b5888a798475cd50a0a08b1e
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 64, service_time_ns: 10.0}
                  - {request_size: 2048, service_time_ns: 27.221679688}
                  - {request_size: 4096, service_time_ns: 45.0}
              local_ub_copy_stride_128b:
                request_size_unit: payload_bytes
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/local_ub_copy_stride_128b_cann_8_5_1.json
                evidence_sha256: 7f542981cd6e548408f1f188fb9bc1980fc73f3f64ac0da5749a69acd1405592
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 1024, service_time_ns: 13.889160156}
                  - {request_size: 2048, service_time_ns: 18.471679688}
                  - {request_size: 4096, service_time_ns: 27.639160156}
              # [MEASURED_MECHANISM] Exact UB-only segments on either side
              # of the CANN BF16 Mul DAG's B-input completion boundary. The
              # prefix is Cast(x1); the suffix is Cast(x2)->Mul->Cast(y).
              # Three position-balanced independent runs consumed no GM or
              # production/evaluation duration. Worker count is encoded in
              # each service identity; request size conserves the number of
              # source Vector operations represented by that segment.
              aiv_elementwise_mul_prefix_46_workers:
                request_size_unit: source_vector_operations
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/aiv_elementwise_mul_prefix_46_workers_cann_8_5_1.json
                evidence_sha256: 11246338b6e46e1f6066faebb5677e2de4684a5d2f96509573242cede20ae4bd
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 1280, service_time_ns: 80.0}
                  - {request_size: 1792, service_time_ns: 100.0}
              aiv_elementwise_mul_suffix_46_workers:
                request_size_unit: source_vector_operations
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/aiv_elementwise_mul_suffix_46_workers_cann_8_5_1.json
                evidence_sha256: fbcfdfe4cfb8e31d889c11359c89cc3ecedcbfba2cd1c53323f9f55d40d2dc08
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 3840, service_time_ns: 140.0}
                  - {request_size: 5376, service_time_ns: 180.0}
              aiv_elementwise_mul_prefix_47_workers:
                request_size_unit: source_vector_operations
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/aiv_elementwise_mul_prefix_47_workers_cann_8_5_1.json
                evidence_sha256: c0f5af7549565e3316f8224cad1da63b924b28401e18a8619164e41d59681696
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 768, service_time_ns: 60.0}
                  - {request_size: 1408, service_time_ns: 80.0}
                  - {request_size: 1536, service_time_ns: 100.0}
                  - {request_size: 2816, service_time_ns: 140.0}
              aiv_elementwise_mul_suffix_47_workers:
                request_size_unit: source_vector_operations
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/aiv_elementwise_mul_suffix_47_workers_cann_8_5_1.json
                evidence_sha256: 8cb2f0ea9647b941ccd8926618fe47357c89539be101c98f1c87ba5562f1ab72
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 2304, service_time_ns: 120.0}
                  - {request_size: 4224, service_time_ns: 160.0}
                  - {request_size: 4608, service_time_ns: 160.0}
                  - {request_size: 8448, service_time_ns: 260.0}
              # [MEASURED_MECHANISM] One source-exact RMSNorm scalar chain:
              # two V->S handoffs, GetValue, scalar normalization, SetValue,
              # and one S->V handoff.  The request size is the two lowered
              # row-scalar operations replaced by this indivisible chain.
              rmsnorm_local_scalar_dependency:
                request_size_unit: lowered_scalar_operations_per_chain
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/rmsnorm_local_scalar_dependency_cann_8_5_1.json
                evidence_sha256: 89aa370a4b5a27d201ae2f9d7de1c24dc60e596807dd0f5ecf6ab26f20b54a5f
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 2, service_time_ns: 50.0}
              norm_sqrt_duplicate_div_serialized:
                request_size_unit: fp32_elements
                service_time_unit: ns_per_request_per_aiv
                lookup_policy: exact_only
                evidence_ref: microbench/ascend_910b/references/vector_norm_request_cann_8_5_1.json
                evidence_sha256: 520ba7ae51d3ed01b6a66f8b91fac3151cbf09a9e17004f8fb4e8c6f5dae0fe1
                production_or_evaluation_duration_consumed: false
                entries:
                  - {request_size: 1, service_time_ns: 55.555826823}
                  - {request_size: 2, service_time_ns: 55.555826823}
                  - {request_size: 3, service_time_ns: 55.555826823}
                  - {request_size: 4, service_time_ns: 55.555826823}
