  # ═══ Shared L2 / GM ══════════════════════════════════════
  - name: xbar
    role: xbar
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    # [INI] AICoreMemoryRates.l2_rate = 110 B/clk/AIC.  The shared envelope
    # contains 24 AICs: 24 * 110 = 2640 B/clk.  Do not replace this with a
    # throughput inferred from production GEMM duration.
    throughput_per_clk: 2640
    traffic_filter: null

  - name: l2
    role: l2_cache
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    # [INI] AICoreMemoryRates.l2_rate = 110 B/clk/AIC.  The aggregate
    # 24-AIC capacity is 2640 B/clk; read/write-specific INI rates remain
    # available in the checked-in platform reference for a future split-path
    # model.
    throughput_per_clk: 2640
    traffic_filter: lru
    size_bytes: 201326592                 # [INI] l2_size=192MB
    # INI l2PageNum=64 is page metadata, not a proven service/queue partition
    # count.  The aggregate-only NPU path therefore exposes no partition model.
    num_partitions: null

  - name: dram
    role: dram
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    # [INI] AICoreMemoryRates.ddr_rate = 32 B/clk/AIC.  The shared envelope
    # contains 24 AICs: 24 * 32 = 768 B/clk.  Do not use the former 778 B/clk
    # value retained for MAPE, or 667 B/clk inferred from production GEMM
    # duration; neither is a legal Forward parameter source.
    throughput_per_clk: 768
    traffic_filter: page_conflict
    size_bytes: 68719476736               # [INI] memory_size=64GiB
    num_partitions: null                  # GM service/queue partition count unknown

# ─── Resource groups ─────────────────────────────────────
resource_groups:
  - name: tensor_pipe
    members: [tensor_core_fp16]
  - name: fma_sfu_pipe
    members: [fma_pipe, sfu_pipe]
  - name: alu_pipe
    members: [alu_pipe]
  - name: smem
    members: [shared_mem]
  - name: l1_cache
    members: [l1_cache]
  - name: xbar
    members: [xbar]
  - name: l2
    members: [l2]
  - name: dram
    members: [dram]
  # AIC local buffers (INI record; excluded from the current timing model)
  - name: aic_local_buffers
    members: [l0a_buffer, l0b_buffer, l0c_buffer, bt_buffer]
  # AIV domain (Vector predictor uses a separate role)
  - name: vector_pipe
    members: [vector_pipe, reduction_service]
  - name: scalar_aiv
    members: [vscalar_pipe]
  - name: unified_buffer
    members: [unified_buffer]
  - name: mte2
    members: [mte2_pipe]
  - name: mte3
    members: [mte3_pipe]

# ─── Memory subsystem ────────────────────────────────────
# AIC/AIV are separate, while GM/L2 are globally shared. Latencies require AscendC pointer-chase measurements.
memory_subsystem:
  # The INI exposes 192 MiB of physical L2.  A workload-independent 24-AIC
  # disjoint ND2NZ counter sweep retains exactly one compulsory miss pass up
  # to 160 MiB and begins repeat misses at 168 MiB.  Use the largest proven
  # resident footprint for fully-associative replacement replay while keeping
  # the nominal physical size unchanged for launch derivation and reporting.
  l2_replacement_capacity_bytes: 167772160
  l2_replacement_capacity_evidence_ref: microbench/ascend_910b/references/shared_l2_replacement_capacity_cann_8_5_1.json
  l2_replacement_capacity_evidence_sha256: 0138b99ffbf77d3874cb229e02484c51017aaba2824fa518ecbaf6edfb826da3
  # [MEASURED_MECHANISM] A full-chip dirty-L2 preamble followed by a
  # source-exact AIC MTE2 program measures victim writeback backpressure that
  # is internal to L2 and absent from the AIC DRAM-write counter.
  l2_dirty_replacement_capacity_bytes_per_s: 913901169183.1204
  l2_dirty_replacement_evidence_ref: microbench/ascend_910b/references/l2_dirty_replacement_backpressure_cann_8_5_1.json
  l2_dirty_replacement_evidence_sha256: 0fcc80bf229161065372a901b59d0e6584bc820723f32e89a489d3211fd27eb4
  # [INI] MTE2 and MTE3 expose independent endpoints, but they converge on
  # one shared GM/HBM fabric.  A cold, full-chip AIV copy sweep above the
  # 192-MiB L2 capacity sustains one aggregate read-plus-write stream rather
  # than two independent full-rate directions.  Preserve the INI directional
  # rates while serializing their service demand at the shared fabric.
  dram_arbitration_mode: shared_directional_capacity
  dram_read_capacity_per_clk: 768   # 24 AIC groups * ddr_read_rate 32 B/clk
  dram_write_capacity_per_clk: 768  # 24 AIC groups * ddr_write_rate 32 B/clk
  # Earlier 101-ns/225-GB/s MTE2 candidates lacked retained evidence.  The
  # source-bound 2026-08-12 recapture also rejected both a common pipeline
  # capacity and a configuration-independent serial residual across 4--64 KiB.
  # Keep all transaction/startup parameters explicitly unavailable.  The
  # production NPU path consumes only INI/static aggregate byte capacities.
  mte2_tile_latency_fixed_ns: null
  mte2_transfer_bw_gbs: null
  mte2_per_core_peak_gbs: null
  mte2_gemm_tile_bytes: null
  # No source-bound evidence separates generic L2 and GM endpoints, and the
  # INI L0 alignment is not a cache-line or MTE descriptor measurement.
  dram_latency_ns: null
  l2_latency_ns: null
  cacheline_bytes: null
  l2_conflict_efficiency_moe: 1.0
  dram_protocol_efficiency: 1.0
  # The INI aggregate GM envelope is consumed without an additional empirical
  # tiled-path derate.
  dram_protocol_efficiency_l1cached: 1.0
  # No source-bound raw artifact currently supports applying the former
  # 114-row small-GEMM refetch window to grouped Fused-MoE.  Keep this optional
  # mechanism disabled until a non-duration traffic/tile observation proves the
  # scope and transfer lifecycle.
  gemm_l1_refetch_tile_rows: null
  # [MEASURED_MECHANISM] CANN 8.5.1 MDL CopyIn issues one BF16 128x64 A
  # descriptor followed by one BF16 64x256 B descriptor for each full base-K
  # tile.  Independent 24-AIC probes measure each descriptor with a 64-MiB
  # L2-resident ring and a disjoint 512-MiB (>192-MiB L2) ring.  Their sums
  # agree with the corresponding paired probes within 1.2%, proving that A and
  # B are serial producer services.  Source-order LRU selects hit/miss classes;
  # tails remain on the generic byte path.  No production duration is consumed.
  memory_access_class_services:
    # [MEASURED_MECHANISM] Independent 48-AIV CANN queue program with two
    # disjoint GM inputs, one constant output, and no Add/Mul tensor payload.
    # Each source stream exceeds the 192-MiB L2.  Three independent device-7
    # runs measured the exact Add source tile widths with <0.13% cross-run
    # spread.  The read/write capacities are the fixed 2:1 byte shares of the
    # measured aggregate service, so max(read_time, write_time) equals one
    # source-shaped 2R+1W completion bound rather than an additive residual.
    - service: cann_bf16_binary_two_read_one_write_gm_read
      access_kind: read
