          # artifact: profiler_output/microbench/metax_c500/
          #   rmsnorm_phase_chain_4cc56ade_20260906_r2
          # source/report SHA256:
          #   853a4372c190587775aff56ed01f870862ef6eb2dda9bca5a608c57fea04fbad
          #   6c715f6876e2a32b6a5f27148235a1542e76c0acc680b759233d5c6a3472e3a4
          rmsnorm_phase_chain_excess_first_1024: 9433962.955763273
          rmsnorm_phase_chain_excess_first_1024_active2: 13513516.910902927
          rmsnorm_phase_chain_excess_first_1024_active4: 21276644.536145803
          rmsnorm_phase_chain_excess_first_1024_active8: 83333305.1220299
          # The same source-chain campaign also isolates the fixed device-side
          # phase entry after subtracting the independently measured complete
          # block1024 scheduler envelope. The deepest 16-to-32-round interval
