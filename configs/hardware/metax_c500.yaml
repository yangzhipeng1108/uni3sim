hardware_id: metax_c500
# ============================================================
# MetaX C500 64GB Hardware Spec (V3 Component Tree Model)
# 104 APs (SM-equivalent), HBM2e 64GB, 8MB L2
# ============================================================
#
# Source classes are intentionally separated below: the user-supplied C500
# architecture reference, the profiler metric guide, macainfo/runtime device
# queries, and retained independent mechanism microbenchmarks.  The metric
# guide is not itself an architecture specification, and architecture
# envelopes are not described as sustained measurements.
#
# Candidate C500 BF16 product envelope: 240 TFLOPS.  The primary product-spec
# artifact is not retained in this checkout.  A retained MACA 3.7.2
# register-only BF16 16x16x16 MMA sweep reaches 1993.394 FLOP/AP/clock at
# 32 waves/AP (498.349/PEU/clock), independently supporting but not replacing
# the 2048 FLOP/AP/clock architecture peak; it is not a production-operator
# measurement or a reason to substitute a sustained endpoint for the peak.
#   per AP per clk = 240e12 / 104 / 1.125e9 = 2048 ops/clk (= 4 subcores × 512)
#   macainfo: PEUs per AP = 4 (confirmed 4 subcores per AP)

# ─── Clock domains ────────────────────────────────────────
clock_domains:
  sm: 1125000000        # AP (SM-equivalent) frequency (Hz)
                        # Source: mx-smi --show-dpm: XCORE max level 9 = 1125 MHz
  dram: 1800000000      # HBM2e effective clock (Hz)
                        # Source: mx-smi --show-clocks: MC1_DFICLK = 1800 MHz
                        # Consistent with c500.py bandwidth=1.800 TB/s

components:
  # ─── AP (SM) subtree (per-AP resources) ─────────────────
  - name: sm
    count: 104
    children:
      - name: subcore
        count: 4
        children:
          - name: tensor_core
            role: compute_tensor
            scope: shared
            count: 1
            type: compute
            primary_variant: fp16
            variants:
              - name: fp16
                # 512 FLOP/PEU/clock gives the candidate 240-TFLOP/s full-chip
                # BF16/FP16 envelope at 104 AP x 4 PEU x 1.125 GHz.  The
                # retained MACA 3.7.2 register-only BF16 sweep reaches
                # 498.349 FLOP/PEU/clock at 32 waves/AP.
                throughput_per_clk: 512
              - name: bf16
                throughput_per_clk: 512
          - name: fma_pipe
            role: compute_fma
            scope: shared
            count: 1
            type: compute
            # Formula demand is arithmetic operations.  The architecture has
            # 16 lanes/PEU and a full-lane FMA performs two operations/lane,
            # hence 32 FLOP/PEU/clock at the documented issue envelope.
            throughput_per_clk: 32
          - name: sfu_pipe
            role: compute_sfu
            scope: shared
            count: 1
            type: compute
            # Register-resident EXP2/RCP/RSQRT primitive sweeps reach
            # 15.603 op/AP/clock at the architectural maximum 32 waves/AP,
            # i.e. 3.901 op/PEU/clock.  Together with the common Vector-ALU
            # issue slot this supports a 4-op/PEU/clock primitive envelope;
            # expf/rsqrtf library recipes contain multiple opcodes and are not
            # represented as one primitive operation.  An independent MACA
            # 3.7.2 statically-unrolled campaign measures 16 XCORE cycles per
            # dependent EXP/RCP/RSQ/RCPI wave opcode.  That latency has no
            # valid additive primitive-op Forward consumer and does not alter
            # this throughput envelope. Source-level exp(-x) and 1/(1+x)
            # dependency services are instead measured by an independent
            # runtime-counted 512-thread mechanism benchmark. Adjacent loop
            # depths remove launch and terminal-store work; trials 1--2 derive
            # the rates and frozen trial 3 validates at 0.89% max APE. The
            # saturated report unit is block-layers/AP/s, so each configured
            # rate is divided across the four physical PEU resources per AP.
            # Setup is the single-grid block-layer latency minus one saturated
            # AP service interval. No production/evaluation duration is used.
            # artifact: profiler_output/microbench/metax_c500/
            #   semantic_math_builtin_throughput_4c9df8a_20260826_r8/report.json
            # source/report SHA256:
            #   4c9df8a687b0c06a5bde5a410f898e311a21069ecb5d9b3344cb8cf02cdde354
            #   9101b34ddbb525ad50c75568c7b4af6689f35450e629513f6a552cb61a1d7897
            throughput_per_clk: 4
            service_rates_per_unit_s:
              exp_dependency: 6458774.993203525
              reciprocal_one_plus_dependency: 2104363.2072809557
            service_setup_time_s:
              exp_dependency: 4.04296770284418e-09
              reciprocal_one_plus_dependency: 1.4246088539948659e-08
          - name: alu_pipe
            role: compute_alu
            scope: shared
            count: 1
            type: compute
            # One Vector-ALU issue across 16 lanes per PEU.
            throughput_per_clk: 16
      - name: shared_mem
        role: smem
        scope: per_unit
        count: 1
        type: memory
        throughput_per_clk: 128           # supplied architecture peak
        traffic_filter: null              # torch: shared_memory_per_multiprocessor = 65536 (64KB)
        size_bytes: 65536
      - name: l1_cache
        role: l1_cache
        scope: per_unit
        count: 1
        type: memory
        # Vector L1 is disabled in the supplied architecture.  This nominal
        # value is retained only to satisfy the common component schema; the
        # C500 launch contract removes L1 demand before pricing it.
        throughput_per_clk: 128
        traffic_filter: null              # macainfo: L1 = 32 KB per AP
        size_bytes: 32768
      - name: warp_dispatch
        role: warp_issue
        scope: per_unit
        count: 1
        type: compute
        # The supplied architecture exposes five independent issue slots per
        # AP and at most one instruction in each slot per XCORE cycle.  This
        # is an aggregate instruction-dispatch envelope; per-pipe FMA/SFU/ALU
        # capacities remain separate lower bounds.
        throughput_per_clk: 5
      - name: integer_dependency
        role: compute_vector
        scope: per_unit
        count: 1
        type: compute
        # One operation is one dependent source-level integer division or
        # remainder across a wave64. The independent register-only benchmark
        # uses adjacent runtime repetition counts to remove clock64, loop-entry,
        # launch, and terminal-store overhead. Trials 1--2 derive the slopes;
        # frozen trial 3 validates every service below 0.82% max APE. The
        # benchmark derives one dependent wave64-chain rate per PEU; the rates
        # below multiply it by the four architectural PEUs because this
        # component is placed once per AP. No production or evaluation duration
        # is consumed.
        # artifact: profiler_output/microbench/metax_c500/
        # semantic_integer_dependency_8be0dd1_20260826_r2/report.json
        # source/report SHA256:
        # 8be0dd1e9a7d37f15e8144f100d5ae0e58a13312f5db052bee7a33c9ca00e418
        # b789e62537cd2199c76bd05362b020860f873958fc7d206d48d8ea9422acdcca
        throughput_per_clk: 1
        exact_request_services:
          # The fixed vLLM 0.8.5 / MACA 3.7.2 block128 RMSNorm program has
          # two waves per CTA. mcProfiler's non-duration lifecycle counter
          # reports their mean admission-to-completion span. This exact
          # request is a completion envelope with zero modeled occupancy:
          # the issue service below remains the steady-state throughput and
          # later CTAs overlap this finite tail.
          rmsnorm_block128_wave_lifetime_completion:
            request_size_unit: source_program_completion
            service_time_unit: ns_per_cta_completion
            lookup_policy: exact_only
            evidence_ref: microbench/metax_c500/references/rmsnorm_block128_program_completion_maca_3_7_2.json
            evidence_sha256: c351429739fd6146158db13e9a82dda9b211f66e1abbab9af74a070bc4815fe4
            production_or_evaluation_duration_consumed: false
            entries:
              - {request_size: 1, service_time_ns: 5765.262222222222}
        service_rates_per_unit_s:
          integer_div_u32_dependency: 35139092.240117125
          integer_rem_u32_dependency: 36290322.58064516
          integer_div_u64_dependency: 18433179.723502304
          integer_rem_u64_dependency: 18442622.95081967
          # One operation is one dependent source-semantic wave64 bundle.
          # BF16 roundtrip converts one packed pair to FP32 and back (four
          # scalar conversions); address multiply-add is one uint64 chain.
          # Trials 1--2 derive 100 and 68 XCORE cycles respectively, and the
          # frozen third trial validates at 0.99% and 6.25% max APE. Rates
          # use the documented 1.125 GHz XCORE clock and four PEUs per AP.
          # No production or evaluation duration is consumed.
          # artifact: profiler_output/microbench/metax_c500/
          #   semantic_conversion_address_bf3967ba_20260828_r1/report.json
          # source/report SHA256:
          #   18162ca6d8adf7c3148eb762e9560c13af924883da04553827377b2bdfa6592c
          #   873c0751d00f265528b9bd4937aed42ef9c8de0fb019bdd993e5e1493de453ea
          bf16_roundtrip_pair_dependency: 45000000.0
          address_multiply_add_u64_dependency: 66176470.5882353
          # The fixed vLLM-MetaX 0.8.5 activation code object contains one
          # issue-slot-2 MTE/Vector-ALU instruction service per AP/XCORE cycle.
          # _C.abi3.so SHA256:
          #   a8715e7f7fe1790b46586fd8780036177c083504b24556ae1d661d0f0b569955
          # act_and_mul_kernel_bd_opt at 0x27600, size 0x850; extracted object
          # SHA256 8bcfc2c31a267929281af00ee77e70b182bf0e6261057aaee747e672ac87a9ac;
          # disassembly SHA256
          # 9e595e02a031b75412070b0dd38040460795857ed5e97cfc0ca16402659dfa81.
          # Static active/inactive counts are 247/3 per wave and canonical
          # non-duration MTE counters conserve both counts exactly. No
          # production or evaluation duration is consumed.
          vector_alu_issue_slot_instruction: 1125000000.0
          # [MEASURED_MECHANISM] Source-identical scalar input/output loops
          # for the legacy vLLM 0.8.5 ``rms_norm_kernel`` block128 program.
          # Runtime-counted loop depth isolates steady work from launch and
          # CTA fill; the 16-CTA/AP occupancy is reported by the compiler.
          # Trials 1--2 derive the services and trial 3 validates the four
          # function/block families at 4.73% aggregate MAPE and 26.52% max
          # APE. No production/evaluation duration is consumed.
          # artifact: profiler_output/microbench/metax_c500/
          #   rmsnorm_scalar_block128_20260908_r2/report.json
          # source/runner/report SHA256:
          #   9ab52e3e7a21e62bfd9ea627a5e04b83d02b84f7ff515cc17a79d787a945c127
          #   4a53ec17779766f324eff0762c42efc5b8532de4a83bc175d2e4d2646551b8e7
          #   3786b2e01c3ed80b2c683d650515e118964ce2b08bfc4dab7710b0e421814791
          rmsnorm_input_square_resident_128: 64023866.94044592
          rmsnorm_input_square_queued_128: 24327846.149403196
          rmsnorm_output_scale_resident_128: 18748842.91617159
          rmsnorm_output_scale_queued_128: 16147716.890284926
          # One operation is one complete 1024-lane scalar RMSNorm source
          # steady round. The input service preserves idx+=blockDim.x, BF16 load,
          # conversion, and loop-carried square accumulation. The output
          # service preserves two scalar loads, scale multiply, intermediate
          # BF16 round trip, weight multiply, final BF16 conversion, and
          # store. The deepest adjacent 16-to-32-round difference isolates the
          # steady service after loop startup. Trials 1--2 derive the
          # first/resident/queued services; frozen trial 3 validates the 24
          # cells at 5.88% MAPE and 21.19% max APE.
          # The block1024 source and probe both have occupancy two. No
          # production or evaluation duration is consumed.
          # artifact: profiler_output/microbench/metax_c500/
          #   rmsnorm_scalar_round_bc319476_20260904_r4
          # source/report SHA256:
          #   b348567505883967144bec8d4da55c5fd0e80db6886c4a1562fbbe43d97ac5b2
          #   01bfa21d1641146b76a086962b1340ca927d98a04124494f5127430c9768493f
          # The source-identical extension measures depths 2 and 3 in the
          # same campaign matrix and preserves the compiled instruction and
          # occupancy signatures. Its deep-round holdout remains publishable
          # at 5.74% MAPE and 24.63% max APE; no service coefficient changes.
          # artifact: profiler_output/microbench/metax_c500/
          #   rmsnorm_shallow_round_d71ced91_20260907_gpu3
          # source/report SHA256:
          #   181a31811b454cb03aea33e36b876a5fa3c3db0f85590bb256fded36460d68eb
          #   6f4f7431bb63625ddfd1144fd8698b446e02bddbb751257e20f94befd8757304
          rmsnorm_input_square_resident_1024: 5586588.697932833
          rmsnorm_input_square_queued_1024: 3686636.155264143
          rmsnorm_output_scale_resident_1024: 3246753.6815877995
          rmsnorm_output_scale_queued_1024: 2059732.602470379
          # One operation is the positive per-round excess introduced when
          # the two scalar RMSNorm loops execute in one CTA program across a
          # published scalar phase boundary. Exact active-unit services stop
          # at eight APs: both derivation trials become nonpositive at 16 APs,
