          # artifact: profiler_output/microbench/metax_c500/
          #   rmsnorm_phase_chain_4cc56ade_20260907_r3/report.json
          # runner/report SHA256:
          #   dc4f95b0b8972959d63ecd7a8eae8b052a7a09ee778f6a34eebd608e969d7131
          #   526ed16c8acc3fc3e4206465d784d3f6a1c5096d9e0bda83ceebb0ccad8376a9
          rmsnorm_phase_entry_first_1024: 520699.3929801098
          rmsnorm_phase_entry_first_1024_active2: 466531.65214295086
          rmsnorm_phase_entry_first_1024_active4: 453423.25411788153
          rmsnorm_phase_entry_first_1024_active8: 417819.5356661483
          rmsnorm_phase_entry_first_1024_active16: 388010.9577998842
          # One operation is the per-scalar-round excess produced when the
          # pinned generic BF16 AddRMSNorm input and output loops execute in
          # one block1024 CTA around their publication barrier. Trials 1--2
