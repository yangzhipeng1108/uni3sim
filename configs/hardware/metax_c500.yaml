          # source/runner/report SHA256:
          #   c08b6ef7839f4e4cec199769d2b721a9a881f39b4e2c50e6970ea9075f877b27
          #   a250065eb5d25d701afac381d2466764f509c5c1d9b381e81ecb51a97271f1b9
          #   cc37e28259df5ba744d538151802a606e0a95612ab3e02a105d42cb45a94c039
          add_rmsnorm_phase_chain_excess_first_1024_active2: 2666666.643487083
          add_rmsnorm_phase_chain_excess_first_1024_active4: 2747253.5744751655
          add_rmsnorm_phase_chain_excess_first_1024_active8: 3225806.7223845464
          add_rmsnorm_phase_chain_excess_first_1024_active16: 4065041.919348528
          add_rmsnorm_phase_chain_excess_first_1024_active32: 16129030.583428469
          # The same source-identical campaign separately isolates the generic
