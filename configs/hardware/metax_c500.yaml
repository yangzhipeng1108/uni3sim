# ─── Interconnect ─────────────────────────────────────────
# MetaX proprietary interconnect (MetaXLink, not NVLink).
# The retained MACA 3.7.2 TransferBench full 4-GPU matrix reports 50.7--95.1
# GB/s for off-diagonal directed transfers with no data errors.  Use the
# measured 50.7 GB/s topology bottleneck as the conservative unidirectional
# payload capacity; this field is shared with the existing communication
# predictor but physically denotes MetaXLink, not NVLink.  Raw evidence:
# profiler_output/microbench/metax_c500/p2p_bandwidth/
# 20260826_maca372/transferbench.typescript.
interconnect:
  nvlink_unidir_bw_GB_s: 50.7
  nvlink_signal_latency_ns: null
  nccl_alpha_ns: null
  # Host<->device transfer link (PCIe), used by memcpy DTOH/HTOD predictor.
  pcie_bw_GB_s: null
                                      # Bandwidth-latency model t = pcie_latency + bytes/bw
                                      # (replaces the earlier fixed memcpy_*_fixed_ns constants;
                                      #  GT DTOH/HTOD duration spans 1.8us-2.6ms → BW-dependent).
  pcie_latency_ns: null
  infiniband_unidir_bw_GB_s: null

# ─── Features ────────────────────────────────────────────
features:
  kernel_memory_model: gpu_mshr
  async_output_release: self
  # Retain the conservative downstream completion boundary until MetaX
  # exposes an architectural coherent-cache completion guarantee.
  gpu_store_completion_scope: dram
  # MACA's captured Full-Graph programs dispatch their source CTAs over
  # every resolved Graph slot/tensor extent rather than the logical
  # request shape; the recorded model-input arrays are the physical
  # execution domain for the source-marked tile16 FA and Norm programs.
  full_graph_physical_extent_dispatch: true
  # PIECEWISE replays the same captured segments over the padded token
  # tensor (vLLM pads num_tokens to the capture bucket and only the eager
  # attention/KV-update ops see the unpadded count).  The serving
  # launch-identity runs record this directly: at 264 scheduled tokens in the
  # 272 bucket the per-head q-norm launches grid 8704 = 272 x 32 and the
  # residual add-norm grid 272 (microbench/metax_c500/operators/gemm/
  # serving_launch_identity).  Launch facts only; no duration.
  piecewise_graph_physical_extent_dispatch: true
  kernel_dtype: bf16
  l1_cache_enabled: false
  cluster_supported: false
  cluster_size: 0
  multicast_supported: false
  hw_decompression: false
  compression_ratio: 1.0
