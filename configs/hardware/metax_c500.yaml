  # ─── Shared resources (not per-AP) ──────────────────────
  - name: xbar
    role: xbar
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # User-supplied C500 architecture reference: L2 datapath peak 4096 B/clk.
    throughput_per_clk: 4096
    traffic_filter: null

  - name: l2
    role: l2_cache
    scope: shared
    clock_domain: sm
    count: 1
    type: memory
    # Incompressible 4 MiB ldg_b128 sweep, with disassembly proving nine live
    # unrolled/remainder loads and live telemetry proving sustained 1125 MHz
    # XCORE, reaches 3617.534 GB/s: 3617.534 / 1.125 = 3215.59 B/clk.
    # This is a retained read-pattern candidate; the documented 4096 B/clk
    # remains the peak xbar datapath above.
    # An instruction/address-matched hot/cold interference benchmark rejects
    # the full additive shared-fill candidate for aligned ldg_b128 at the
    # frozen 25%/50% contrasts.  Retain the existing independent-service lower
    # bound; this evidence does not establish the exact internal topology.
    throughput_per_clk: 3215.59
    traffic_filter: lru
    size_bytes: 8388608                   # 8 MB (macainfo: L2 = 8192 KB)
    num_partitions: null                  # not published; request queueing disabled

  - name: dram
    role: dram
    scope: shared
    clock_domain: dram
    count: 1
    type: memory
    # The retained v3 independent large-footprint sweep reaches 1653.070 GB/s
    # at 64 MiB/grid=1664 with live 1800 MHz MC telemetry and verified loads:
    # 1653.070 / 1.8 = 918.372 B/MC-cycle read-pattern candidate.
    throughput_per_clk: 918.372
    traffic_filter: page_conflict
    size_bytes: 68719476736               # 64 GB (mx-smi: vram total 67108864 KB)
    num_partitions: null                  # controller/channel count not proven by supplied docs

# ─── Resource groups ─────────────────────────────────────
resource_groups:
  # MMA and Vector ALU share issue slot 2, but their execution services do not
  # serialize for the full MMA initiation interval.  The retained MACA 3.7.2
  # register-only mixed stream reaches the MMA-only envelope with 4 MMA plus
  # up to 12 independent add_f32 instructions, then follows the aggregate
  # one-instruction/slot/cycle envelope.  Keep Tensor execution and Vector
  # execution as independent lower bounds; exact static instruction consumers
  # express the shared slot through warp_issue below.
  - name: tensor_pipe
    members: [tensor_core_fp16]

  - name: vector_pipe
    members: [fma_pipe, sfu_pipe, alu_pipe]

  - name: warp_issue
    members: [warp_dispatch]

  - name: integer_dependency
    members: [integer_dependency]

  - name: reduction_dependency
    members: [serial_dependency]

  - name: smem
    members: [shared_mem]

  - name: l1_cache
    members: [l1_cache]

  - name: xbar
    members: [xbar]

  - name: l2
    members: [l2]

  - name: dram
    members: [dram]

# ─── Memory subsystem (latency-hiding parameters) ────────
# The latency endpoints below remain documented cycle references.  The retained
# dependent-chain candidate at baseline 78e0cbc has complete raw provenance but
# does not establish one L2 plateau or an instruction-matched control subtraction,
# so it is not promoted.  These remain provisional first-request inputs;
# sustained steady state is constrained by the independent byte capacities.
memory_subsystem:
  # Shared half-duplex directional endpoints.  Read retains the independent
  # 918.372 B/MC-cycle large-footprint ldg_b128 sweep.  Write uses the
  # independent aligned stg_b128-devc endpoint: 21 event trials have a
  # 1607.860088573 GB/s median at a live 1.8-GHz MC clock.  A target-kernel-
  # identical profile-only build reports 8,589,934,784 physical global-write bytes for
  # 8,589,934,592 logical bytes and 67,108,875 DNoC write requests (only 11
  # above the exact 128-B-line count), closing write allocation/traffic without
  # consuming mcProfiler replay duration.  Mixed duration still does not define
  # turnaround or a service curve.
  dram_arbitration_mode: shared_directional_capacity
  dram_read_capacity_per_clk: 918.372
  dram_write_capacity_per_clk: 893.2556047625426
  dram_latency_ns: 373.3333333333     # architecture reference: 420 AP cycles
  # Source-independent task floor for a contiguous BF16 device copy on the
  # pinned torch 2.4.0 + MACA 3.7.2 stack.  The paired graph-replay
  # differential subtracts the directional read/write payload service before
  # selecting the minimum across derivation trials 1--2; all 135 samples in
  # frozen trial 3 remain above the selected floor.  No production/evaluation
  # duration or target operator is consumed.
  # Evidence: microbench/metax_c500/references/
  # bf16_dtod_copy_task_floor_maca_3_7_2.json
  memcpy_dtod_floor_ns: 9612.988764927777
  # The source-selected native FlashAttention output copies (decode
  # transpose12 write-back and the split-forward prefill slice assignment) are
  # the contiguous BF16 D2D runtime task.  Its 256-KiB--4-MiB plateau is the
  # minimum derivation-trial median minus the independent directional payload
  # service over the 256-KiB, 1-MiB and 4-MiB probes; the 4-MiB probes leave
  # the selected floor unchanged and frozen trial 3 stays above it.  It is not
  # a kernel or Serving observation.
  # Evidence: microbench/metax_c500/references/
  # native_flash_attention_copy_medium_floor_maca_3_7_2.json
  # (sha256 b7929cbfd3e794c72072277be66a88061346b0802f2b62849da1f80ab4a90820,
  # derived from bf16_dtod_copy_task_floor_maca_3_7_2.json sha256
  # cd800f8d3974890729a2a2e3c344362fadb0b7bb072bdf1ca38e979a4deb3342)
  memcpy_dtod_native_flash_attention_copy_medium_min_bytes: 262144
  memcpy_dtod_native_flash_attention_copy_medium_max_bytes: 4194304
  memcpy_dtod_native_flash_attention_copy_medium_floor_ns: 35735.33924058255
  l2_latency_ns: 151.1111111111       # architecture reference: 170 AP cycles
  cacheline_bytes: 128                # cache-line granularity
  # The architecture reference establishes one 128-B transaction for an
  # aligned 16-lane group.  It does not establish scattered/non-coalesced
  # sectors per request; diagnostics therefore declare that scope limitation.
  l2_transaction_bytes: 128
  dram_transaction_bytes: 128         # aligned DNoC line/request evidence only
  # One consistent latency chain from the supplied architecture document.
  # These remain documented references rather than values promoted from the
  # retained pointer-chase candidate.  C500 exposes a unified L2, so no
  # unmeasured near/far split is introduced:
  #   L2 endpoint = 170 cycles; DRAM endpoint = 420 cycles.
  l2_hit_latency_local_cycles: 170
  l2_hit_latency_remote_cycles: 170
  l2_local_fraction: null
  dram_miss_extra_cycles: 250
  l2_partition_service_cycles_bw: null  # byte-capacity-only; no fabricated M/D/1
  # One Vector Memory instruction/AP/cycle is an instruction issue envelope,
  # not a sustained 128-byte transaction rate.  A wave instruction can form
  # four transactions, so a transaction frontend ceiling remains unknown.
  lsu_peak_issue_rate_per_sm: null
  # No checked-in benchmark constrains an AP-local source/path population.
  # Keep the hardware ceiling absent; Forward must not infer it from a
  # full-chip bandwidth plateau.
  source_slots_per_unit: null
  # Exact access-class services below remain workload-independent.  The BF16
