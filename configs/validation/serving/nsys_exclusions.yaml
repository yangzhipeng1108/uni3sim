# Pre-registered kernel exclusions registry for the tiered nsys comparison.
#
# WHY THIS EXISTS (zero-fitting discipline):
# The tiered comparison's Tier 2 (per-kernel exactness) compares the synthesized
# kernel trace against nsys ground truth. A small set of kernels are NOT
# analytically derivable from the model/operator structure — they are cuBLAS
# autotuner micro-decisions, NCCL collective-internal decompositions, or
# framework noise (copy/fill/index). These are excluded from the per-kernel
# match, BUT every excluded launch is COUNTED and reported by category so the
# exclusion is auditable and can never silently hide a real modeling miss.
#
# CONTRACT (AC-2.4):
# - This registry is fixed BEFORE measurement. It is a run INPUT, never tuned
#   per result to make a specific model pass.
# - Each entry has an explicit name-pattern match rule (substring, lowercased).
# - The comparison reads this file; it does not hardcode exclusions.
# - Adding/removing an entry is a deliberate, reviewed change with a rationale,
#   not a per-case deletion.
#
# Matching: a kernel name (lowercased) that contains ANY `match` substring of an
# entry is attributed to that entry's category and excluded from the Tier 2
# per-kernel set. First matching category wins; more specific patterns (flash,
# splitK) are listed before broad ones (GEMM with "cutlass") so flash kernels
# whose template args contain "cutlass::half_t" are not misattributed to GEMM.
#
# SCOPE (per entry, default "all"):
#   scope: all    -> excluded from BOTH Tier 1 category counts and the Tier 2
#                    exact per-launch gate. Use for genuinely off-model launches
#                    (framework noise, NCCL collective decomposition, cuBLAS
#                    splitKreduce / flash split-reduce epilogues).
#   scope: tier2  -> the kernel's CATEGORY is modeled and still counted by Tier 1,
#                    but its specific name + grid + block is a non-derivable
#                    autotuner/occupancy variant, so it is excluded only from the
#                    Tier 2 exact per-launch comparison. Use for cuBLAS GEMM tile
#                    selection and FlashAttention num_splits — both are decided by
#                    vendor heuristics at launch time and cannot be derived from
#                    the model/operator structure without reverse-engineering the
#                    vendor autotuner (forbidden by the zero-fitting design).

version: 1

exclusions:
  - category: FLASH_SPLIT_OCCUPANCY
    scope: tier2
    rationale: >-
      FlashAttention split-KV compute kernel (flash_fwd_splitkv) grid. The kernel
      identity and count are modeled (Tier 1), but its grid encodes the runtime
      num_splits / KV-block partition chosen by FlashAttention's occupancy
      heuristic (nsys grid e.g. (1,2,8) or (2,1,16) vs a token-derived (16,1,1)),
      driven by KV length, head count, and SM count. Not derivable from token
      counts; excluded from the Tier 2 exact gate only. (The split-KV REDUCE
      epilogue flash_fwd_splitkv_combine is separately excluded scope=all below,
      since it may be entirely absent.)
    match:
      - "flash_fwd_splitkv_kernel"
      - "flash_fwd_kernel"

  - category: FLASH_SPLIT_REDUCE
    scope: all
    rationale: >-
      FlashAttention split-KV reduction epilogue (flash_fwd_splitkv_combine).
      The main attention compute (flash_fwd_splitkv) is always present and
      modeled; the combine kernel appears ONLY when FlashAttention's runtime
      num_splits heuristic chooses to split the KV dimension across CTAs, which
      depends on KV length, head count, and SM occupancy — a hardware-occupancy
      autotuner micro-decision, not derivable from token counts (e.g. Qwen3-0.6B
      512-token prompts emit it; Qwen3-30B-A3B short prompts do not). Same class
      as the cuBLAS splitKreduce epilogue above; excluded as an autotuner artifact.
    match:
      - "splitkv_combine"

  - category: GEMM_AUTOTUNER_TILE
    scope: tier2
    rationale: >-
      cuBLAS/cuBLASLt and cutlass GEMM tile/variant selection, plus the vLLM
      grouped-expert GEMM (fused_moe_kernel). The GEMM / FUSEDMOE category counts
      are modeled and verified by Tier 1, but WHICH tiled kernel is launched
      (s16816gemm 128x128 vs 128x64 vs 64x64, gemvx vs gemv2T for decode; the
      fused_moe grid encodes the per-expert token tiling chosen at launch) and
      the resulting grid/block are autotuner micro-decisions that vary per shape
      and per library/version. Measured: synth grid (32,1) vs nsys (32,2) for the
      same GEMM; fused_moe grid (E,1,1) vs nsys (384/512/8832...). Not derivable
      without per-model/per-library fitting; excluded from the Tier 2 exact gate
      only (still counted in Tier 1).
    match:
      - "gemm"
      - "gemvx"
      - "gemv2t"
      - "cutlass"
      - "xmma"
      - "fused_moe_kernel"

  - category: SPLITK
    scope: all
    rationale: >-
      cuBLAS/cuBLASLt split-K reduce epilogue. Whether a tensor-core GEMM is
      executed as split-K with a separate reduce kernel is a cuBLAS autotuner
      micro-decision that differs across models for near-identical shapes
      (e.g. Qwen3-4B emits splitKreduce, Llama-3.1-8B does not). Not
      shape-derivable without per-model fitting; excluded as a cuBLAS-internal
      artifact.
    match:
      - "splitkreduce"

  - category: NCCL_DECOMP
    scope: all
    rationale: >-
      NCCL / vLLM collective-communication internal kernel decomposition. The
      public collective call (all-reduce / all-to-all / all-gather) is stable
      and modeled, but how NCCL lowers it into device kernels varies by topology,
      rank count, algorithm/protocol, and message size. The collective is matched
      at the operation level (count/volume), not by its internal kernel split.
    match:
      - "nccldevkernel"
      - "nccl"
      - "cross_device_reduce"
      - "all_reduce_kernel"

  - category: FRAMEWORK_NOISE
    scope: all
    rationale: >-
      PyTorch/framework auxiliary kernels not part of the transformer model
      computation: elementwise copy/fill/cast, trivial index/gather/scatter for
      bookkeeping, arange, and similar runtime glue. These are framework runtime
      work, not model ops, and are not emitted by the operator→kernel recipe.
    match:
      - "elementwise_kernel"
      - "vectorized_elementwise"
      - "unrolled_elementwise"
      - "direct_copy"
      - "fillfunctor"
      - "fill_kernel"
      - "::fill"
      - "catarray"
      - "indexselect"
      - "index_select"
      - "index_elementwise"
      - "arange"
      - "distribution_elementwise"
