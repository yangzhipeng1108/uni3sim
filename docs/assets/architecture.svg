<svg xmlns="http://www.w3.org/2000/svg" viewBox="188 162 855 458" width="855" height="458" role="img" aria-labelledby="title desc">
  <title id="title">Uni³Sim host, memory, and kernel-plan architecture</title>
  <desc id="desc">Requests enter a vLLM or SGLang scheduler backed by a host and memory pool. The scheduler creates a kernel plan, which feeds a performance model and a host-device timeline. Host overhead also feeds the host-device timeline. Communication operations provide H2D, D2H, D2D and collective transfers. The performance model exchanges state with local HBM, HBF and DRAM; timeline step times and memory APIs feed back to the scheduler.</desc>
